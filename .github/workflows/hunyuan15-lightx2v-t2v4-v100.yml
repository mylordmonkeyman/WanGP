name: Hunyuan 1.5 V100 full LightX2V 4-step distilled T2V bar benchmark

# Intentional one-off dispatch on the isolated research branch. Downloads are
# prohibited in generation; the user staged the full distilled checkpoint in the host cache.
on:
  push:
    branches: [research/hunyuan15-v100-native-fp16-20261116]
    paths:
      - .github/workflows/hunyuan15-lightx2v-t2v4-v100.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunyuan15-lightx2v-t2v4-v100
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate 4-step benchmark syntax and settings
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hunyuan15_checkpoint_audit.py \
            benchmarks/hunyuan15_fp16/v100_bar_video_smoke.py \
            benchmarks/hunyuan15_fp16/v100_t2v_cached_steady_state.py \
            benchmarks/hunyuan15_fp16/v100_t2v_lightx2v_4step.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          model=json.loads(Path('finetunes/hunyuan15_v100_t2v_480_lightx2v_4step_fp16_experiment.json').read_text())['model']
          assert model['hunyuan15_native_fp16'] is True
          assert model['dtype'] == 'fp16'
          assert model['URLs'][0].endswith('/hy1.5_t2v_480p_lightx2v_4step.safetensors')
          p=Path("benchmarks/hunyuan15_fp16/v100_t2v_lightx2v_4step.py")
          s=p.read_text()
          for token in ('"num_inference_steps": 4','"guidance_scale": 1.0',
                        '"flow_shift": 8.0','"activated_loras": []',
                        '"loras_multipliers": ""','--offline',
                        'hy1.5_t2v_480p_lightx2v_4step.safetensors'):
              assert token in s,token
          print("HUNYUAN15_LIGHTX2V_STATIC_PASS")
          PY

  t2v:
    needs: lint
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 90
    env:
      HUNYUAN15_TEST_MODE: t2v
      HUNYUAN15_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      HUNYUAN15_TEST_OUT: /cache/ltx25/results/hunyuan15-lightx2v-t2v4-${{ github.run_id }}-attempt${{ github.run_attempt }}
      PYTHONPATH: .
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm V100 and cached full 4-step distilled checkpoint
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi -L
          test -x "$HUNYUAN15_PYTHON"
          test -s /cache/ltx25/results/hunyuan15-fp16-downloaded-checkpoints/hunyuanvideo1.5_480p_t2v_fp16.safetensors
          test -s /cache/ltx25/results/hunyuan15-fp16-downloaded-checkpoints/hy1.5_t2v_480p_lightx2v_4step.safetensors
          ls -lh \
            /cache/ltx25/results/hunyuan15-fp16-downloaded-checkpoints/hunyuanvideo1.5_480p_t2v_fp16.safetensors \
            /cache/ltx25/results/hunyuan15-fp16-downloaded-checkpoints/hy1.5_t2v_480p_lightx2v_4step.safetensors
      - name: Generate full distilled 4-step T2V and time excluding all downloads
        shell: bash
        run: |
          set -euo pipefail
          "$HUNYUAN15_PYTHON" -u benchmarks/hunyuan15_fp16/v100_t2v_lightx2v_4step.py \
            2>&1 | tee hunyuan15-lightx2v-t2v4.log
          grep -Fq HUNYUAN15_LIGHTX2V_4STEP_T2V_PASS hunyuan15-lightx2v-t2v4.log
      - name: Publish checkpoint header audit, settings, diagnostics and timing comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hunyuan15-lightx2v-t2v4-results
          if-no-files-found: warn
          retention-days: 21
          path: |
            hunyuan15-lightx2v-t2v4.log
            /cache/ltx25/results/hunyuan15-lightx2v-t2v4-${{ github.run_id }}-attempt${{ github.run_attempt }}/distilled_checkpoint_audit.json
            /cache/ltx25/results/hunyuan15-lightx2v-t2v4-${{ github.run_id }}-attempt${{ github.run_attempt }}/t2v/settings.json
            /cache/ltx25/results/hunyuan15-lightx2v-t2v4-${{ github.run_id }}-attempt${{ github.run_attempt }}/t2v/summary.json
            /cache/ltx25/results/hunyuan15-lightx2v-t2v4-${{ github.run_id }}-attempt${{ github.run_attempt }}/t2v/lightx2v_4step_comparison.json
            /cache/ltx25/results/hunyuan15-lightx2v-t2v4-${{ github.run_id }}-attempt${{ github.run_attempt }}/t2v/logs/*.log
      - name: Publish frame-decoded 4-step LightX2V MP4
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hunyuan15-lightx2v-t2v4-bar-mp4
          retention-days: 21
          compression-level: 0
          if-no-files-found: warn
          path: /cache/ltx25/results/hunyuan15-lightx2v-t2v4-${{ github.run_id }}-attempt${{ github.run_attempt }}/t2v/clips/*.mp4
