name: Hunyuan 1.5 V100 native FP16 default MMGP profile verification

on:
  push:
    branches:
      - optimization/hunyuan15-v100-fp16
    paths:
      - .github/workflow-triggers/hunyuan15-native-profile-default-run.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v100-serialized-optimization-experiments
  cancel-in-progress: false

jobs:
  cpu-profile-tests:
    name: CPU native profile and BF16 isolation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Branch ancestry, Python checks, model-aware defaults
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = optimization/hunyuan15-v100-fp16
          git merge-base --is-ancestor 7b4c3f5ab3595eff14450eeb2549779931ede405 HEAD
          python3 -m py_compile wgp.py benchmarks/hunyuan15_fp16/p0_hot_queue.py benchmarks/hunyuan15_fp16/p0_trace.py shared/hunyuan15_fp16_profile.py
          python3 -m unittest discover -v -s benchmarks/hunyuan15_fp16 -p test_profile_default.py
          python3 -m unittest discover -v -s benchmarks/hunyuan15_fp16 -p test_p0_hot.py
      - name: Narrow launch scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path(".github/workflows/hunyuan15-v100-native-profile-default.yml").read_text()
          assert "      - optimization/hunyuan15-v100-fp16" in s
          assert "      - .github/workflow-triggers/hunyuan15-native-profile-default-run.txt" in s
          assert not any(x in ("  schedule:", "  pull_request:") for x in s.splitlines())
          print("NATIVE_DEFAULT_SAFE_TRIGGER_PASS")
          PY

  gpu-default-smoke:
    name: Two-video native profile1 hot-state verification
    needs: cpu-profile-tests
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 30
    env:
      HUNYUAN15_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      HUNYUAN15_TEST_OUT: /cache/ltx25/results/hunyuan15-default-profile-${{ github.run_id }}-attempt${{ github.run_attempt }}
      PYTHONPATH: .
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify idle GPU and cached native model
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7b4c3f5ab3595eff14450eeb2549779931ede405 HEAD
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
          nvidia-smi --query-gpu=name --format=csv,noheader | grep -q V100
          ACTIVE="$(nvidia-smi --query-compute-apps=pid --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+' || true)"
          if [ -n "$ACTIVE" ]; then echo "GPU occupied, abort default smoke: $ACTIVE" >&2; exit 1; fi
          test -x "$HUNYUAN15_PYTHON"
          test -s /cache/ltx25/results/hunyuan15-fp16-downloaded-checkpoints/hunyuanvideo1.5_480p_t2v_fp16.safetensors
          test -s /cache/ltx25/results/hunyuan15-converted-lora-43951751237-attempt1/converted_loras/hunyuan15_t2v_lightx2v4_rank32_wangp_qkv_split_bf16.safetensors
          echo NATIVE_DEFAULT_GPU_IDLE_PASS
      - name: Native selected finetune without any CLI profile override
        shell: bash
        run: |
          set -euo pipefail
          "$HUNYUAN15_PYTHON" -u benchmarks/hunyuan15_fp16/p0_hot_queue.py --native-default-smoke 2>&1 | tee default-profile.log
          grep -Fq HUNYUAN15_NATIVE_DEFAULT_PROFILE1_PASS default-profile.log
          test -s "$HUNYUAN15_TEST_OUT/native_default/baseline.json"
      - name: Upload default verification trace and videos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hunyuan15-native-fp16-profile1-default-proof
          retention-days: 21
          if-no-files-found: warn
          path: |
            default-profile.log
            /cache/ltx25/results/hunyuan15-default-profile-${{ github.run_id }}-attempt${{ github.run_attempt }}/native_default/baseline.json
            /cache/ltx25/results/hunyuan15-default-profile-${{ github.run_id }}-attempt${{ github.run_attempt }}/native_default/generation.log
            /cache/ltx25/results/hunyuan15-default-profile-${{ github.run_id }}-attempt${{ github.run_attempt }}/native_default/trace/requests.jsonl
            /cache/ltx25/results/hunyuan15-default-profile-${{ github.run_id }}-attempt${{ github.run_attempt }}/native_default/videos/*.mp4
