name: Hunyuan 1.5 V100 P1B MMGP profile exploratory screen

# Only an explicit edit of the dedicated branch-only trigger launches GPU work.
on:
  push:
    branches:
      - optimization/hunyuan15-v100-fp16
    paths:
      - .github/workflow-triggers/hunyuan15-p1b-run.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v100-serialized-optimization-experiments
  cancel-in-progress: false

jobs:
  cpu-fixtures:
    name: Syntax, branch ancestry, fixed-reference P0 fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: optimization/hunyuan15-v100-fp16
          persist-credentials: false
          fetch-depth: 0
      - name: Check ancestry and branch scope
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = optimization/hunyuan15-v100-fp16
          git merge-base --is-ancestor 7b4c3f5ab3595eff14450eeb2549779931ede405 HEAD
          python3 -m py_compile benchmarks/hunyuan15_fp16/p0_trace.py benchmarks/hunyuan15_fp16/p0_hot_queue.py benchmarks/hunyuan15_fp16/p1b_compare.py wgp.py
          python3 -m unittest discover -v -s benchmarks/hunyuan15_fp16 -p test_p0_hot.py
      - name: No unrelated automatic GPU triggers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path(".github/workflows/hunyuan15-v100-p1b.yml").read_text()
          assert "  workflow_dispatch:" in s
          assert "      - optimization/hunyuan15-v100-fp16" in s
          assert "      - .github/workflow-triggers/hunyuan15-p1b-run.txt" in s
          assert not any(line in ("  schedule:", "  pull_request:") for line in s.splitlines())
          print("P1B_TRIGGER_SCOPE_PASS")
          PY

  v100-profile-screen:
    name: Offline serialized MMGP profile 0, 1, 3 hot screen
    needs: cpu-fixtures
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 90
    env:
      HUNYUAN15_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      HUNYUAN15_TEST_OUT: /cache/ltx25/results/hunyuan15-p1b-${{ github.run_id }}-attempt${{ github.run_attempt }}
      PYTHONPATH: .
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: optimization/hunyuan15-v100-fp16
          persist-credentials: false
          fetch-depth: 0
      - name: Branch and V100-idle preflight
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7b4c3f5ab3595eff14450eeb2549779931ede405 HEAD
          test -x "$HUNYUAN15_PYTHON"
          nvidia-smi --query-gpu=name,compute_cap,memory.total --format=csv,noheader
          nvidia-smi --query-gpu=name --format=csv,noheader | grep -q V100
          ACTIVE="$(nvidia-smi --query-compute-apps=pid --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+' || true)"
          if [ -n "$ACTIVE" ]; then
            echo "GPU is occupied, cannot start MMGP comparison: $ACTIVE" >&2
            exit 1
          fi
          test -s /cache/ltx25/results/hunyuan15-fp16-downloaded-checkpoints/hunyuanvideo1.5_480p_t2v_fp16.safetensors
          test -s /cache/ltx25/results/hunyuan15-converted-lora-43951751237-attempt1/converted_loras/hunyuan15_t2v_lightx2v4_rank32_wangp_qkv_split_bf16.safetensors
          echo "P1B_PREFLIGHT_PASS"
      - name: Run three independent profile sessions, never concurrently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HUNYUAN15_TEST_OUT"
          for PROFILE in 0 1 3; do
            echo "P1B_PROFILE_BEGIN $PROFILE"
            set +e
            "$HUNYUAN15_PYTHON" -u benchmarks/hunyuan15_fp16/p0_hot_queue.py --p1b --profile "$PROFILE" 2>&1 | tee "p1b-profile-$PROFILE.log"
            RC="${PIPESTATUS[0]}"
            set -e
            echo "P1B_PROFILE_EXIT $PROFILE $RC" | tee -a "p1b-profile-$PROFILE.log"
            echo "$RC" > "$HUNYUAN15_TEST_OUT/profile-$PROFILE-exit.txt"
            if [ "$PROFILE" = 0 ] && [ "$RC" -ne 0 ]; then
              echo "Aborting subsequent profiles: P1B reference failed" >&2
              exit "$RC"
            fi
          done
          test -s "$HUNYUAN15_TEST_OUT/p1b/profile_0/baseline.json"
      - name: Produce labeled exploratory report; never claim promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 -u benchmarks/hunyuan15_fp16/p1b_compare.py "$HUNYUAN15_TEST_OUT" | tee p1b-report.log
          test -s "$HUNYUAN15_TEST_OUT/p1b_comparison.json"
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hunyuan15-p1b-profile-reports
          retention-days: 21
          if-no-files-found: warn
          path: |
            p1b-profile-*.log
            p1b-report.log
            /cache/ltx25/results/hunyuan15-p1b-${{ github.run_id }}-attempt${{ github.run_attempt }}/p1b_comparison.json
            /cache/ltx25/results/hunyuan15-p1b-${{ github.run_id }}-attempt${{ github.run_attempt }}/profile-*-exit.txt
            /cache/ltx25/results/hunyuan15-p1b-${{ github.run_id }}-attempt${{ github.run_attempt }}/p1b/**/baseline.json
            /cache/ltx25/results/hunyuan15-p1b-${{ github.run_id }}-attempt${{ github.run_attempt }}/p1b/**/trace/requests.jsonl
            /cache/ltx25/results/hunyuan15-p1b-${{ github.run_id }}-attempt${{ github.run_attempt }}/p1b/**/generation.log
      - name: Upload baseline and candidate videos for later comparisons
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hunyuan15-p1b-profile-clips
          retention-days: 21
          compression-level: 0
          if-no-files-found: warn
          path: /cache/ltx25/results/hunyuan15-p1b-${{ github.run_id }}-attempt${{ github.run_attempt }}/p1b/**/videos/*.mp4
