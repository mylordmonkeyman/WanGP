name: Hunyuan 1.5 V100 P2C latent-file opt-in smoke and parity

on:
  push:
    branches:
      - optimization/hunyuan15-v100-fp16
    paths:
      - .github/workflow-triggers/hunyuan15-p2c-run.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v100-serialized-optimization-experiments
  cancel-in-progress: false

jobs:
  cpu-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fixed branch, P2C policy unit tests, Python syntax
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = optimization/hunyuan15-v100-fp16
          git merge-base --is-ancestor 7b4c3f5ab3595eff14450eeb2549779931ede405 HEAD
          python3 -m py_compile benchmarks/hunyuan15_fp16/p2c_latent_policy.py benchmarks/hunyuan15_fp16/test_p2c_latent_policy.py models/hyvideo/diffusion/pipelines/pipeline_hunyuan_video.py
          python3 -m unittest discover -v -s benchmarks/hunyuan15_fp16 -p test_p2c_latent_policy.py

  v100-io:
    needs: cpu-gate
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 45
    env:
      HUNYUAN15_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      P2C_ROOT: /cache/ltx25/results/hunyuan15-p2c-${{ github.run_id }}-attempt${{ github.run_attempt }}
      PYTHONPATH: .
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify idle V100 and clean latent-file workspace
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7b4c3f5ab3595eff14450eeb2549779931ede405 HEAD
          test -x "$HUNYUAN15_PYTHON"
          nvidia-smi --query-gpu=name --format=csv,noheader | grep -q V100
          ACTIVE="$(nvidia-smi --query-compute-apps=pid --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+' || true)"
          if [ -n "$ACTIVE" ]; then echo "GPU occupied: $ACTIVE" >&2; exit 1; fi
          test ! -e latent.pt
          mkdir -p "$P2C_ROOT"
          test -s /cache/ltx25/results/hunyuan15-fp16-downloaded-checkpoints/hunyuanvideo1.5_480p_t2v_fp16.safetensors
          test -s /cache/ltx25/results/hunyuan15-converted-lora-43951751237-attempt1/converted_loras/hunyuan15_t2v_lightx2v4_rank32_wangp_qkv_split_bf16.safetensors
          echo "P2C_CLEAN_IDLE_PASS"
      - name: P2C mode skip debug latent write; output still valid
        shell: bash
        run: |
          set -euo pipefail
          HUNYUAN15_TEST_OUT="$P2C_ROOT/skip" \
          HUNYUAN15_P2C_ENABLE=1 HUNYUAN15_P2C_SAVE_DEBUG_LATENTS=0 \
            "$HUNYUAN15_PYTHON" -u benchmarks/hunyuan15_fp16/p0_hot_queue.py --cold-only 2>&1 | tee p2c-skip.log
          grep -Fq P0_COLD_REFERENCE_PASS p2c-skip.log
          test ! -e latent.pt
          test ! -e "$P2C_ROOT/debug-latents.pt"
          echo "P2C_SKIP_PASS"
      - name: P2C mode explicit debug latent write to unique output file
        shell: bash
        run: |
          set -euo pipefail
          HUNYUAN15_TEST_OUT="$P2C_ROOT/save" \
          HUNYUAN15_P2C_ENABLE=1 HUNYUAN15_P2C_SAVE_DEBUG_LATENTS=1 \
          HUNYUAN15_P2C_LATENT_PATH="$P2C_ROOT/debug-latents.pt" \
            "$HUNYUAN15_PYTHON" -u benchmarks/hunyuan15_fp16/p0_hot_queue.py --cold-only 2>&1 | tee p2c-save.log
          grep -Fq P0_COLD_REFERENCE_PASS p2c-save.log
          test ! -e latent.pt
          test -s "$P2C_ROOT/debug-latents.pt"
          echo "P2C_EXPLICIT_SAVE_PASS"
      - name: Verify video frame parity and debug latent dtype / shape without loading on GPU
        shell: bash
        run: |
          set -euo pipefail
          "$HUNYUAN15_PYTHON" - <<'PY' | tee p2c-parity.log
          import os,glob,subprocess,torch,json
          root=os.environ["P2C_ROOT"]
          clips={}
          for kind in ("skip","save"):
              matches=glob.glob(root+"/"+kind+"/p0/cold/videos/*.mp4")
              assert len(matches)==1,(kind,matches)
              p=subprocess.run(["ffmpeg","-hide_banner","-loglevel","error",
                  "-i",matches[0],"-map","0:v:0","-f","framemd5","-"],
                  capture_output=True,text=True,check=True)
              hashes=[line.split(",")[-1].strip() for line in p.stdout.splitlines()
                      if line and not line.startswith("#")]
              assert len(hashes)==33,(kind,len(hashes))
              clips[kind]=hashes
          latent=torch.load(root+"/debug-latents.pt",map_location="cpu",weights_only=True)
          assert tuple(latent.shape)==(1,32,9,30,52),tuple(latent.shape)
          assert latent.is_floating_point() and torch.isfinite(latent).all(), "non-finite debug latent"
          assert clips["skip"]==clips["save"],"VAE outputs changed when toggling debug write"
          print("P2C_DECODED_VIDEO_PARITY_PASS",json.dumps({
              "frames":len(clips["skip"]),"debug_latent_shape":list(latent.shape),
              "debug_latent_dtype":str(latent.dtype)}))
          PY
          grep -Fq P2C_DECODED_VIDEO_PARITY_PASS p2c-parity.log
      - name: Upload P2C logs and lightweight results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hunyuan15-p2c-runtime-results
          retention-days: 21
          if-no-files-found: warn
          path: |
            p2c-*.log
            /cache/ltx25/results/hunyuan15-p2c-${{ github.run_id }}-attempt${{ github.run_attempt }}/debug-latents.pt
            /cache/ltx25/results/hunyuan15-p2c-${{ github.run_id }}-attempt${{ github.run_attempt }}/*/p0/cold/cold.json
            /cache/ltx25/results/hunyuan15-p2c-${{ github.run_id }}-attempt${{ github.run_attempt }}/*/p0/cold/generation.log
