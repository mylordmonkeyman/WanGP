name: Hunyuan 1.5 V100 P3B existing VAE tile presets

on:
  push:
    branches:
      - optimization/hunyuan15-v100-fp16
    paths:
      - .github/workflow-triggers/hunyuan15-p3b-presets-run.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v100-serialized-optimization-experiments
  cancel-in-progress: false

jobs:
  cpu-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm fixed branch and P3B preset harness
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = optimization/hunyuan15-v100-fp16
          git merge-base --is-ancestor 7b4c3f5ab3595eff14450eeb2549779931ede405 HEAD
          python3 -m py_compile benchmarks/hunyuan15_fp16/p0_hot_queue.py benchmarks/hunyuan15_fp16/p3b_preset_compare.py
          python3 -m unittest discover -v -s benchmarks/hunyuan15_fp16 -p test_p0_hot.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path(".github/workflows/hunyuan15-v100-p3b-presets.yml").read_text()
          assert "      - .github/workflow-triggers/hunyuan15-p3b-presets-run.txt" in s
          assert not any(x in ("  schedule:","  pull_request:") for x in s.splitlines())
          print("P3B_NO_BROAD_AUTO_GPU_PASS")
          PY

  v100-presets:
    name: Offline same-math model / VAE preset 0-1-2-3 serial hot trials
    needs: cpu-fixtures
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 120
    env:
      HUNYUAN15_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      P3B_ROOT: /cache/ltx25/results/hunyuan15-p3b-${{ github.run_id }}-attempt${{ github.run_attempt }}
      PYTHONPATH: .
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Idle V100, pinned ancestry and cached model preflight
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7b4c3f5ab3595eff14450eeb2549779931ede405 HEAD
          test -x "$HUNYUAN15_PYTHON"
          nvidia-smi --query-gpu=name,compute_cap,memory.total --format=csv,noheader
          nvidia-smi --query-gpu=name --format=csv,noheader | grep -q V100
          ACTIVE="$(nvidia-smi --query-compute-apps=pid --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+' || true)"
          if [ -n "$ACTIVE" ]; then echo "GPU is occupied, refusing VAE preset trial: $ACTIVE" >&2; exit 1; fi
          test -s /cache/ltx25/results/hunyuan15-fp16-downloaded-checkpoints/hunyuanvideo1.5_480p_t2v_fp16.safetensors
          test -s /cache/ltx25/results/hunyuan15-converted-lora-43951751237-attempt1/converted_loras/hunyuan15_t2v_lightx2v4_rank32_wangp_qkv_split_bf16.safetensors
          echo "P3B_IDLE_PASS"
      - name: Run unchanged preset 0 followed by existing presets 1, 2, 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$P3B_ROOT"
          for VAE in 0 1 2 3; do
            echo "P3B_PRESET_BEGIN $VAE" | tee "p3b-$VAE.log"
            set +e
            HUNYUAN15_TEST_OUT="$P3B_ROOT/preset_$VAE" "$HUNYUAN15_PYTHON" -u \
              benchmarks/hunyuan15_fp16/p0_hot_queue.py --p3b --vae-config "$VAE" 2>&1 | tee -a "p3b-$VAE.log"
            EXIT="${PIPESTATUS[0]}"
            set -e
            echo "P3B_PRESET_END $VAE exit=$EXIT" | tee -a "p3b-$VAE.log"
            echo "$EXIT" > "$P3B_ROOT/preset-$VAE-exit.txt"
            if [ "$VAE" = 0 ] && [ "$EXIT" -ne 0 ]; then
              echo "Fixed-reference baseline failed; abort VAE candidates" >&2
              exit "$EXIT"
            fi
          done
      - name: Summarize hot E2E, decode time, frame parity for existing presets
        run: |
          set -euo pipefail
          "$HUNYUAN15_PYTHON" -u benchmarks/hunyuan15_fp16/p3b_preset_compare.py "$P3B_ROOT" | tee p3b-report.log
          test -s "$P3B_ROOT/p3b_preset_summary.json"
      - name: Upload traces, report and logs including rejected candidates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hunyuan15-p3b-presets-reports
          retention-days: 21
          if-no-files-found: warn
          path: |
            p3b-*.log
            /cache/ltx25/results/hunyuan15-p3b-${{ github.run_id }}-attempt${{ github.run_attempt }}/preset-*-exit.txt
            /cache/ltx25/results/hunyuan15-p3b-${{ github.run_id }}-attempt${{ github.run_attempt }}/p3b_preset_summary.json
            /cache/ltx25/results/hunyuan15-p3b-${{ github.run_id }}-attempt${{ github.run_attempt }}/*/p3b/vae_config_*/baseline.json
            /cache/ltx25/results/hunyuan15-p3b-${{ github.run_id }}-attempt${{ github.run_attempt }}/*/p3b/vae_config_*/trace/requests.jsonl
            /cache/ltx25/results/hunyuan15-p3b-${{ github.run_id }}-attempt${{ github.run_attempt }}/*/p3b/vae_config_*/generation.log
      - name: Upload decoded videos for seam and fidelity review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hunyuan15-p3b-presets-clips
          retention-days: 21
          compression-level: 0
          if-no-files-found: warn
          path: /cache/ltx25/results/hunyuan15-p3b-${{ github.run_id }}-attempt${{ github.run_attempt }}/*/p3b/vae_config_*/videos/*.mp4
