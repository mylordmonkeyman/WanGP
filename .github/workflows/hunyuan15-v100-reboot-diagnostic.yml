name: Hunyuan 1.5 V100 diagnose smoke runner interruption

on:
  push:
    branches: [optimization/hunyuan15-v100-fp16]
    paths: [.github/workflows/hunyuan15-v100-reboot-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v100-serialized-optimization-experiments
  cancel-in-progress: false

jobs:
  reboot-check:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check host kernel boot time, GPU, process state and any readable crash logs
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== UTC ==='; date -u -Is
            echo '=== HOST KERNEL BOOT ==='; uptime -s || true
            cat /proc/uptime || true
            cat /proc/sys/kernel/random/boot_id || true
            echo '=== NVIDIA GPU ==='; nvidia-smi -L || true
            nvidia-smi --query-gpu=name,temperature.gpu,memory.used,memory.free --format=csv,noheader || true
            echo '=== GPU PROCESSES ==='
            nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader || true
            echo '=== LIVE PROCESSES ==='
            ps -eo pid,etimes,args | grep -E '[R]unner.Listener|[R]unner.Worker|[w]gp.py' | head -20 || true
            echo '=== READABLE PREVIOUS BOOT KERNEL WARNINGS ==='
            journalctl -k -b -1 --no-pager 2>&1 | grep -Ei 'panic|watchdog|soft lockup|hard lockup|oom|NVRM|Xid|MCE|hardware error|reboot|reset|segfault' | tail -70 || true
            echo '=== READABLE CURRENT BOOT KERNEL WARNINGS ==='
            journalctl -k -b 0 --no-pager 2>&1 | grep -Ei 'panic|watchdog|soft lockup|hard lockup|oom|NVRM|Xid|MCE|hardware error|reboot|reset' | tail -40 || true
          } 2>&1 | tee hunyuan15-reboot-diagnostic.log
      - name: Save log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hunyuan15-v100-runner-interruption-diagnostic
          retention-days: 14
          if-no-files-found: warn
          path: hunyuan15-reboot-diagnostic.log
