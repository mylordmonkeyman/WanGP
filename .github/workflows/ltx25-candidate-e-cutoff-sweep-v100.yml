name: V100 Candidate E M cutoff crossover microbenchmark
on:
  push:
    branches: [perf/ltx25-candidate-e-cutoff-sweep-20261114]
    paths:
      - benchmarks/ltx25_convrot/cutoff_crossover_microbench.py
      - .github/workflows/ltx25-candidate-e-cutoff-sweep-v100.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false
jobs:
  crossover:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 40
    env:
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_CUTOFF_MICRO_OUT: /cache/ltx25/results/cutoff-micro-${{ github.run_id }}-attempt${{ github.run_attempt }}.json
      WAN2GP_LTX25_CUBLAS_E_MODE: fp32rot
      WAN2GP_LTX25_HADAMARD: radix4
      WAN2GP_LTX25_E_CAST: vector8
      WAN2GP_LTX25_E_OUTPUT: fused
      WAN2GP_LTX25_FP16_GEMM: '1'
      LTX25_FP16_GEMM_BACKEND: direct
      LTX25_FP16_GEMM_GROUPS: stage2:wide,stage2:tall,stage2:balanced
      LTX25_FP16_GEMM_OPS: qbytes_mm
      LTX25_FP16_GEMM_MIN_M: '1'
      LTX25_FP16_GEMM_MIN_DIM: '64'
      LTX25_FP16_GEMM_GUARD: first
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout experimental threshold branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Preflight code, V100 and GPU availability
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -m py_compile shared/kernels/ltx25_cublas_sm70.py benchmarks/ltx25_convrot/cutoff_crossover_microbench.py
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          test ! -e "$LTX25_CUTOFF_MICRO_OUT"
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then echo "::error::V100 busy: $busy"; exit 1; fi
          nvidia-smi -L
      - name: Run candidate E vs fallback FP16 crossover matrix
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/cutoff_crossover_microbench.py 2>&1 | tee cutoff-micro.log
          grep -Fq 'LTX25_CUTOFF_MICRO_PASS' cutoff-micro.log
      - name: Upload synthetic latency and numerical-error results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-candidate-e-cutoff-micro-results
          retention-days: 21
          if-no-files-found: warn
          path: |
            cutoff-micro.log
            /cache/ltx25/results/cutoff-micro-${{ github.run_id }}-attempt${{ github.run_attempt }}.json
