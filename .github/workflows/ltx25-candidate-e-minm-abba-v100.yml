name: LTX-2.5 Dev + LoRA 17f Candidate E minM 64 vs 16 ABBA video
on:
  push:
    branches: [perf/ltx25-candidate-e-cutoff-sweep-20261114]
    paths:
      - benchmarks/ltx25_convrot/cutoff_minm_abba_video.py
      - .github/workflows/ltx25-candidate-e-minm-abba-v100.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false
jobs:
  minm_abba:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 40
    env:
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_MINM_VIDEO_OUT: /cache/ltx25/results/minm-video-${{ github.run_id }}-attempt${{ github.run_attempt }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout cutoff-test branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Check runnable code, checkpoints, and idle GPU
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -m py_compile shared/kernels/ltx25_cublas_sm70.py benchmarks/ltx25_convrot/cutoff_minm_abba_video.py
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          for f in \
            /cache/ltx25/models/ltx-2.5-22b-dev_diffusion_model_int8_convrot.safetensors \
            /cache/ltx25/results/dev-lora-cache/ltx-2.5-22b-distilled-lora-450_bf16.safetensors \
            /opt/ltx25/checkpoints/ltx-2.5-22b_video_vae_bf16.safetensors; do
            test -s "$f"
          done
          test ! -e "$LTX25_MINM_VIDEO_OUT"
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then echo "::error::V100 busy: $busy"; exit 1; fi
      - name: Run A-B-B-A 17-frame complete Dev+LoRA T2V with row census
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/cutoff_minm_abba_video.py 2>&1 | tee cutoff-minm-abba.log
          grep -Fq 'LTX25_MINM_VIDEO_ABBA_PASS' cutoff-minm-abba.log
      - name: Save timestamps, routed shapes and conversion statistics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-candidate-e-minm-abba-results
          retention-days: 21
          if-no-files-found: warn
          path: |
            cutoff-minm-abba.log
            /cache/ltx25/results/minm-video-${{ github.run_id }}-attempt${{ github.run_attempt }}/manifest.json
            /cache/ltx25/results/minm-video-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.json
            /cache/ltx25/results/minm-video-${{ github.run_id }}-attempt${{ github.run_attempt }}/partial-results.json
            /cache/ltx25/results/minm-video-${{ github.run_id }}-attempt${{ github.run_attempt }}/results/*.json
            /cache/ltx25/results/minm-video-${{ github.run_id }}-attempt${{ github.run_attempt }}/logs/*.log
      - name: Save 4 quality comparison MP4s
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-candidate-e-minm-abba-videos
          retention-days: 21
          compression-level: 0
          if-no-files-found: warn
          path: /cache/ltx25/results/minm-video-${{ github.run_id }}-attempt${{ github.run_attempt }}/clips/*.mp4
