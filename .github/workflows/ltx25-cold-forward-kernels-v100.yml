name: LTX-2.5 V100 first vs second forward CUDA cold attribution
on:
  push:
    branches: [perf/ltx25-v100-mmgp-transfer-20261115]
    paths:
      - .github/workflows/ltx25-cold-forward-kernels-v100.yml
      - benchmarks/ltx25_convrot/profile_cold_forward_cuda_bar73.py
      - shared/kernels/ltx25_pipeline_profile.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-v100-mmgp-residency-probe
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Verify untouched original hot paths and sampled-pair overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/ltx25_convrot/profile_cold_forward_cuda_bar73.py shared/kernels/ltx25_pipeline_profile.py
          git diff --exit-code 8788b0479362c34e6423d331f115767ad9fe6fdc HEAD -- models/ mmgp/ shared/qtypes/ wgp.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          from contextlib import contextmanager
          src=Path('benchmarks/ltx25_convrot/profile_cold_forward_cuda_bar73.py')
          fn=next(x for x in ast.parse(src.read_text()).body
                  if isinstance(x,ast.FunctionDef)
                  and x.name=='temporary_inference_profile_overlay')
          ns={'ROOT':Path.cwd(),'contextmanager':contextmanager}
          exec(compile(ast.Module(body=[fn],type_ignores=[]),str(src),'exec'),ns)
          target=Path('models/ltx2/ltx_pipelines/distilled.py')
          before=target.read_bytes()
          with ns['temporary_inference_profile_overlay'](True):
              compiled=target.read_text()
              compile(compiled,str(target),'exec')
              assert 'pipeline_profiler.maybe_sample_forward' in compiled
          assert target.read_bytes()==before
          p=Path('shared/kernels/ltx25_pipeline_profile.py').read_text()
          assert '"LTX25_PIPELINE_SAMPLE_FORWARD_INDEXES", "2"' in p
          assert 'call not in SAMPLE_FORWARD_INDEXES' in p
          assert '"LTX25_PIPELINE_SAMPLE_FORWARD_INDEXES": "1,2"' in src.read_text()
          print("LTX25_COLD_FORWARD_STATIC_PASS")
          PY
  measure:
    needs: syntax
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 85
    env:
      PYTHONPATH: .
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_COLD_FORWARD_ROOT: /cache/ltx25/results/cold-forward-kernels-${{ github.run_id }}-attempt${{ github.run_attempt }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Validate original image, checkpoint, and free V100
        shell: bash
        run: |
          set -euo pipefail
          test -x "$LTX25_PYTHON"
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          test -s benchmarks/ltx25_convrot/inputs/profile_i2v_1024x576.png.png
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          test -z "$(nvidia-smi --query-compute-apps=pid --format=csv,noheader | grep -E '[0-9]' || true)"
          nvidia-smi --query-gpu=name,temperature.gpu,power.draw,pstate --format=csv
      - name: Trace first and warmed second stage forwards for T2V and I2V
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/profile_cold_forward_cuda_bar73.py 2>&1 | tee cold-forward-kernels.log
          grep -Fq LTX25_COLD_FORWARD_KERNEL_PASS cold-forward-kernels.log
      - name: Upload sampled CUDA event categories and decoded fidelity checks
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-cold-forward-kernels-73f
          retention-days: 21
          if-no-files-found: warn
          path: |
            cold-forward-kernels.log
            /cache/ltx25/results/cold-forward-kernels-${{ github.run_id }}-attempt${{ github.run_attempt }}/manifest.json
            /cache/ltx25/results/cold-forward-kernels-${{ github.run_id }}-attempt${{ github.run_attempt }}/partial.json
            /cache/ltx25/results/cold-forward-kernels-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.json
            /cache/ltx25/results/cold-forward-kernels-${{ github.run_id }}-attempt${{ github.run_attempt }}/results/*.json
            /cache/ltx25/results/cold-forward-kernels-${{ github.run_id }}-attempt${{ github.run_attempt }}/logs/*.log
