name: LTX-2.5 ConvRot CPU-only source checks

# Source syntax and static contracts only. No V100 runner, CUDA context or model.
on:
  push:
    branches:
      - perf/ltx25-convrot-sm70
    paths:
      - benchmarks/ltx25_convrot/static_smoke_dispatch.signal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Validate changed Python and benchmark workflows without CUDA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile changed Python modules without importing CUDA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            shared/kernels/ltx25_cublas_sm70.py \
            shared/kernels/ltx25_stage_profiler.py \
            shared/kernels/ltx25_workspace_sm70.py \
            shared/kernels/ltx25_real_activation_audit.py \
            benchmarks/ltx25_convrot/candidate_adapter_preflight.py \
            benchmarks/ltx25_convrot/candidate_workspace_preflight.py \
            benchmarks/ltx25_convrot/workspace_video_gate.py \
            benchmarks/ltx25_convrot/candidate_cast4_preflight.py \
            benchmarks/ltx25_convrot/default_auto_preflight.py \
            shared/qtypes/int8_convrot.py \
            benchmarks/ltx25_convrot/cast_microbench.py \
            benchmarks/ltx25_convrot/hadamard_microbench.py \
            benchmarks/ltx25_convrot/candidate_hadamard_preflight.py \
            benchmarks/ltx25_convrot/candidate_flat_mm_preflight.py \
            benchmarks/ltx25_convrot/candidate_algo2_preflight.py \
            benchmarks/ltx25_convrot/gemm_algo_microbench.py \
            benchmarks/ltx25_convrot/hadamard_video_metrics.py \
            benchmarks/ltx25_convrot/publish_hadamard_microbench.py \
            benchmarks/ltx25_convrot/publish_cast_microbench.py \
            benchmarks/ltx25_convrot/wgp_baseline.py \
            benchmarks/ltx25_convrot/publish_quality_status.py
      - name: Check default SM70 scoping, native fallback and no persistent weight copies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          a = Path('shared/kernels/ltx25_cublas_sm70.py').read_text()
          dispatch = Path('shared/qtypes/int8_convrot.py').read_text()
          w = Path('shared/kernels/ltx25_workspace_sm70.py').read_text()
          p = Path('shared/kernels/ltx25_stage_profiler.py').read_text()
          ast.parse(a); ast.parse(w); ast.parse(p)
          assert 'WAN2GP_LTX25_E_WORKSPACE' in a and 'WAN2GP_LTX25_E_WORKSPACE' in w
          assert 'WAN2GP_LTX25_CUBLAS_E_MODE", "fp32rot"' in a
          assert 'WAN2GP_LTX25_E_CAST", "vector4"' in a
          assert 'WAN2GP_LTX25_HADAMARD", "radix4"' in a
          assert 'elif ROT_MODE in ("torch", ""):' in a, 'Torch FP32 rollback is required'
          assert 'ltx25_cublas_rot256_f32' in a
          assert 'WAN2GP_LTX25_GEMM_TUNE", "off"' in a
          assert 'ltx25_cublas_gemm_f16_f32_algo2' in a
          assert 'WAN2GP_LTX25_E_WORKSPACE", "1"' in a
          assert 'WAN2GP_LTX25_CUBLAS_E_MODE", "fp32rot"' in dispatch
          assert 'WAN2GP_LTX25_DEFAULT_ON' in dispatch
          assert 'WAN2GP_LTX25_DEFAULT_ON' in a
          assert 'WAN2GP_LTX25_DEFAULT_ON' in Path('wgp.py').read_text()
          assert 'WAN2GP_LTX25_CUBLAS_E_MODE=off' in dispatch
          assert 'get_device_capability(x.device) != (7, 0)' in a
          assert '_NATIVE_UNAVAILABLE' in a and '_native_library()' in a
          assert 'fcntl.flock' in a and 'os.replace(tmp_path, target)' in a
          assert 'WAN2GP_LTX25_PROFILE_STAGES' in a and 'WAN2GP_LTX25_PROFILE_STAGES' in p
          assert 'w16 = q.to(torch.float16)' in a, 'Weight cast must remain transient'
          assert 'self.w16' not in w and 'self.weight' not in w, 'Pool must not own weight storage'
          assert 'lease.release()' in a
          assert 'torch.cuda.default_stream(device)' in w, 'Pooling must be same-stream only'
          assert 'enable_timing=True' in p and 'sample.events[-1].synchronize()' in p
          assert 'atexit.register(_summary)' in p
          print('STATIC_SMOKE_PASS: syntax, no-env SM70 default, explicit R0 override, native auto fallback, no persistent weight copies')
          PY
