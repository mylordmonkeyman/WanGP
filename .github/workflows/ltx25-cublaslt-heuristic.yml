name: LTX-2.5 V100 isolated cuBLASLt FP32-output heuristic screen

on:
  push:
    branches: [perf/ltx25-convrot-sm70]
    paths:
      - benchmarks/ltx25_convrot/cublaslt_heuristic_dispatch.signal
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false

jobs:
  cublaslt-sm70:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 40
    env:
      LTX25_CUBLASLT_PROBE_LIB: /tmp/libltx25_cublaslt_sm70_probe.so
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'

    steps:
      - name: Checkout exact cuBLASLt research source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Guard V100 and syntax check
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/ltx25_convrot/cublaslt_heuristic_microbench.py
          active="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader |
            grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$active" ]]; then
            echo "V100 occupied: $active" >&2
            exit 1
          fi
          nvidia-smi -L

      - name: Compile isolated cuBLASLt and exact cuBLAS control for SM70
        shell: bash
        run: |
          set -euo pipefail
          nvcc -O3 -std=c++17 -arch=sm_70 -shared -Xcompiler -fPIC \
            benchmarks/ltx25_convrot/ltx25_cublaslt_sm70_probe.cu \
            benchmarks/ltx25_convrot/ltx25_gemm_algo_sm70.cu \
            -lcublasLt -lcublas -o "$LTX25_CUBLASLT_PROBE_LIB"
          test -s "$LTX25_CUBLASLT_PROBE_LIB"

      - name: Benchmark 10 frequent GEMM shapes with both 0 and 8 MiB workspace
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/cublaslt_heuristic_microbench.py

      - name: Publish full numerical and performance results
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'benchmarks/ltx25_convrot')
          from publish_phase0_status import put
          p=Path('/cache/ltx25/results')/('cublaslt_heuristic_'+os.environ['GITHUB_SHA'][:12]+'.json')
          d=json.loads(p.read_text()) if p.is_file() else {
              'status':'NOT_RUN','reason':'V100 busy, compile failed or benchmark crashed',
              'production_eligible':False}
          d['run_id']=os.environ['GITHUB_RUN_ID']
          d['source_sha']=os.environ['GITHUB_SHA']
          d['run_url']='https://github.com/mylordmonkeyman/WanGP/actions/runs/'+d['run_id']
          put('ltx25-cublaslt-heuristic/latest.json',d)
          put('ltx25-cublaslt-heuristic/runs/'+d['run_id']+'.json',d)
          PY

      - name: Require complete report with FP32 reference for ten shapes
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('/cache/ltx25/results')/('cublaslt_heuristic_'+os.environ['GITHUB_SHA'][:12]+'.json')
          assert p.is_file(),p
          d=json.loads(p.read_text())
          assert d['status']=='PASS',d.get('error')
          assert len(d['shapes'])==10,len(d['shapes'])
          assert all(s['baseline_cublas_ms']>0 for s in d['shapes'])
          PY
