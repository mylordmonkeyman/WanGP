name: LTX-2.5 CUDA kernel trace correlation unit checks
on:
  push:
    branches: [perf/ltx25-convrot-sm70]
    paths:
      - .github/workflows/ltx25-cuda-trace-attribution-static.yml
      - benchmarks/ltx25_convrot/verify_cuda_attribution.py
      - shared/kernels/ltx25_cuda_trace_attribution.py
      - shared/kernels/ltx25_pipeline_profile.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Validate trace parsing and CPU/GPU classification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            shared/kernels/ltx25_cuda_trace_attribution.py \
            benchmarks/ltx25_convrot/verify_cuda_attribution.py
          PYTHONPATH=. python3 benchmarks/ltx25_convrot/verify_cuda_attribution.py
