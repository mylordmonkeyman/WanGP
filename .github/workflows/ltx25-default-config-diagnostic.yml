name: LTX-2.5 CPU-only default/config mismatch diagnostic

on:
  push:
    branches:
      - perf/ltx25-convrot-sm70
    paths:
      - benchmarks/ltx25_convrot/default_config_diagnostic.signal
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false

jobs:
  compare:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 15
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compare sanitized config values, settings and log stage counts
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/ltx25_convrot/default_vs_combo_diagnostic.py
      - name: Publish key-hash-only diagnostic results
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from sys import path
          path.insert(0, 'benchmarks/ltx25_convrot')
          from publish_phase0_status import put
          p=Path('/cache/ltx25/results') / ('default_vs_combo_' + os.environ['GITHUB_SHA'][:12] + '.json')
          data=json.loads(p.read_text())
          put('ltx25-quality/default-config-diagnostic/latest.json',data)
          put('ltx25-quality/default-config-diagnostic/runs/' + os.environ['GITHUB_RUN_ID'] + '.json',data)
          PY
