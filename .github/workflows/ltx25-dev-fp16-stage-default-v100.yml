name: LTX-2.5 Dev and Distilled Stage1/Stage2 FP16 default V100 regression
on:
  push:
    branches: [perf/ltx25-dev-fp16-stage-default-20261114]
    paths:
      - benchmarks/ltx25_convrot/dev_fp16_stage_regression.py
      - .github/workflows/ltx25-dev-fp16-stage-default-v100.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false
jobs:
  sm70_phase_regression:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 50
    env:
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_PHASE_OUT: /cache/ltx25/results/fp16-phase-default-${{ github.run_id }}-attempt${{ github.run_attempt }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout FP16 phase-default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Compile patched modules and verify model/LoRA prerequisites and GPU
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -m py_compile \
            shared/kernels/ltx25_selective_fp16_gemm.py \
            models/ltx2/ltx_pipelines/ti2vid_two_stages.py \
            models/ltx2/ltx_pipelines/distilled.py \
            benchmarks/ltx25_convrot/dev_fp16_stage_regression.py
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          for path in \
            /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors \
            /cache/ltx25/models/ltx-2.5-22b-dev_diffusion_model_int8_convrot.safetensors \
            /cache/ltx25/results/dev-lora-cache/ltx-2.5-22b-distilled-lora-450_bf16.safetensors; do
            test -s "$path"
            ls -lh "$path"
          done
          test ! -e "$LTX25_PHASE_OUT"
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then echo "::error::V100 busy: $busy"; exit 1; fi
      - name: Verify default, explicit off, and both-stage environment flags
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/dev_fp16_stage_regression.py --flags-only | tee flags-preflight.log
      - name: Full real-model Dev Stage2 default and Dev both-stage and Distilled Stage2 smoke
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/dev_fp16_stage_regression.py | tee fp16-phase-regression.log
          grep -Fq 'LTX25_PHASE_DEFAULT_PASS' fp16-phase-regression.log
      - name: Publish generation logs, selector counters, timing and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-fp16-phase-default-v100-results
          retention-days: 21
          if-no-files-found: warn
          path: |
            flags-preflight.log
            fp16-phase-regression.log
            /cache/ltx25/results/fp16-phase-default-${{ github.run_id }}-attempt${{ github.run_attempt }}/manifest.json
            /cache/ltx25/results/fp16-phase-default-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.json
            /cache/ltx25/results/fp16-phase-default-${{ github.run_id }}-attempt${{ github.run_attempt }}/logs/*.log
            /cache/ltx25/results/fp16-phase-default-${{ github.run_id }}-attempt${{ github.run_attempt }}/results/*.json
            /cache/ltx25/results/fp16-phase-default-${{ github.run_id }}-attempt${{ github.run_attempt }}/inputs/*.json
      - name: Publish quality-review MP4s
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-fp16-phase-default-v100-videos
          retention-days: 21
          if-no-files-found: warn
          compression-level: 0
          path: /cache/ltx25/results/fp16-phase-default-${{ github.run_id }}-attempt${{ github.run_attempt }}/clips/*.mp4
