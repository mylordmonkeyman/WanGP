name: Recover successful LTX25 Dev+LoRA eight-step 73f MP4 without rerunning GPU
on:
  push:
    branches: [perf/ltx25-dev-lora8-73f-20261114]
    paths:
      - benchmarks/ltx25_convrot/recover_dev_lora8_73.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false
jobs:
  recover:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 9
    env:
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
    steps:
      - name: Checkout optimized WanGP harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Validate completed generation, report actual timings, and recover MP4
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/recover_dev_lora8_73.py | tee dev8-recovery.log
          grep -Fq 'LTX25_DEV8_RECOVERY_PASS' dev8-recovery.log
      - name: Upload recovered timing and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-dev-lora8-73f-recovered-results
          retention-days: 21
          if-no-files-found: warn
          path: |
            dev8-recovery.log
            /cache/ltx25/results/dev-lora8-t2v73-43674180726-attempt1/recovered-summary.json
            /cache/ltx25/results/dev-lora8-t2v73-43674180726-attempt1/input.json
      - name: Upload recovered Dev LoRA8 video
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-dev-lora8-73f-recovered-video
          retention-days: 21
          compression-level: 0
          if-no-files-found: warn
          path: /cache/ltx25/results/dev-lora8-t2v73-43674180726-attempt1/clips/*.mp4
