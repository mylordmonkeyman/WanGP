name: LTX-2.5 Dev INT8 ConvRot + 1.0 distillation LoRA 8-step T2V73
on:
  push:
    branches: [perf/ltx25-dev-lora8-73f-20261114]
    paths:
      - benchmarks/ltx25_convrot/dev_lora8_t2v73.py
      - .github/workflows/ltx25-dev-lora8-t2v73.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false
jobs:
  dev_lora8_73:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 55
    env:
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_DEV_LORA8_OUT: /cache/ltx25/results/dev-lora8-t2v73-${{ github.run_id }}-attempt${{ github.run_attempt }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout WanGP optimized benchmark tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify Dev ConvRot checkpoint and idle V100
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -m py_compile benchmarks/ltx25_convrot/dev_lora8_t2v73.py
          test -s /cache/ltx25/models/ltx-2.5-22b-dev_diffusion_model_int8_convrot.safetensors
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b_video_vae_bf16.safetensors
          test ! -e "$LTX25_DEV_LORA8_OUT"
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then echo "::error::V100 already busy: $busy"; exit 1; fi
      - name: Reuse cached distillation LoRA or download from official Lightricks source
        shell: bash
        env:
          HF_HUB_OFFLINE: '0'
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          name="ltx-2.5-22b-distilled-lora-450_bf16.safetensors"
          official="ltx-2.5-22b-distilled-lora-450-bf16.safetensors"
          candidate_paths=[
              Path("/cache/ltx25/results/dev-lora-cache")/name,
              Path("/cache/ltx25/results/dev-lora-cache")/official,
              Path("/opt/ltx25/checkpoints")/name,
              Path("/opt/ltx25/checkpoints")/official,
              Path("/cache/ltx25/checkpoints")/name,
              Path("/cache/ltx25/checkpoints")/official,
          ]
          existing=next((p for p in candidate_paths if p.is_file() and p.stat().st_size>100_000_000),None)
          if existing is not None:
              print("REUSED_LORA",existing,existing.stat().st_size,flush=True)
          else:
              work=Path("/cache/ltx25/results/dev-lora-cache")
              work.mkdir(parents=True,exist_ok=True)
              try:
                  existing=Path(hf_hub_download(repo_id="DeepBeepMeep/LTX-2",filename=name,local_dir=str(work)))
              except Exception as primary:
                  print("WanGP repackaged LoRA download failed:",repr(primary),flush=True)
                  existing=Path(hf_hub_download(repo_id="Lightricks/LTX-2.5",filename="loras/"+official,local_dir=str(work)))
              print("DOWNLOADED_LORA",existing,existing.stat().st_size,flush=True)
          assert existing.stat().st_size>100_000_000
          dest=Path("loras/ltx2")/name
          dest.parent.mkdir(parents=True,exist_ok=True)
          if dest.is_symlink():
              dest.unlink()
          elif dest.exists():
              assert dest.samefile(existing),f"Unexpected pre-existing LoRA at {dest}"
          if not dest.exists():
              dest.symlink_to(existing)
          print("DEV8_DYNAMIC_LORA",dest.resolve(),flush=True)
          PY
      - name: Generate and time one Dev + dynamic distillation LoRA 73-frame T2V
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/dev_lora8_t2v73.py 2>&1 | tee dev-lora8-t2v73.log
          grep -Fq 'LTX25_DEV_LORA8_T2V73_PASS' dev-lora8-t2v73.log
      - name: Save timing, prompt, model selection, LoRA activation and runtime stats
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-dev-lora8-t2v73-results
          retention-days: 21
          if-no-files-found: warn
          path: |
            dev-lora8-t2v73.log
            /cache/ltx25/results/dev-lora8-t2v73-${{ github.run_id }}-attempt${{ github.run_attempt }}/input.json
            /cache/ltx25/results/dev-lora8-t2v73-${{ github.run_id }}-attempt${{ github.run_attempt }}/manifest.json
            /cache/ltx25/results/dev-lora8-t2v73-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.json
            /cache/ltx25/results/dev-lora8-t2v73-${{ github.run_id }}-attempt${{ github.run_attempt }}/logs/*.log
            /cache/ltx25/results/dev-lora8-t2v73-${{ github.run_id }}-attempt${{ github.run_attempt }}/results/*.json
      - name: Save Dev + 1.0 distillation LoRA MP4
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-dev-lora8-t2v73-video
          retention-days: 21
          compression-level: 0
          if-no-files-found: warn
          path: /cache/ltx25/results/dev-lora8-t2v73-${{ github.run_id }}-attempt${{ github.run_attempt }}/clips/*.mp4
