name: Distilled bar 73f T2V/I2V Candidate E 4096x2048 staged four-way
on:
  workflow_dispatch:  # Historical four-way benchmark, manually invoked only
permissions:
  contents: read
concurrency:
  group: ltx25-distilled-bar73-stage-shape
  cancel-in-progress: false
jobs:
  fourway:
    name: ${{ matrix.mode }} 73f stock vs off vs stage2 vs both
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [t2v, i2v]
    env:
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_BAR73_OUT: /cache/ltx25/results/bar73-stage-shape-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout candidate shape research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout pinned, unmodified upstream stock WanGP
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: deepbeepmeep/WanGP
          ref: c8d47da27023476777a0874300bbc9a4126acca6
          path: stock-wangp-original
          persist-credentials: false
      - name: Link legacy LoRAs required by stock historical model loader
        shell: bash
        run: |
          set -euo pipefail
          dst="stock-wangp-original/loras/ltx2"
          mkdir -p "$dst"
          while IFS= read -r -d '' file; do
            target="$dst/$(basename "$file")"
            if [[ ! -e "$target" ]]; then ln -s "$file" "$target"; fi
          done < <(find /opt/ltx25/checkpoints -type f -iname '*lora*.safetensors' -print0)
          test -L "$dst/ltx-2.5-22b-ic-lora-sdr-to-hdr-1.0.safetensors"
      - name: Verify fixed source, input bar PNG and idling V100
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -m py_compile \
            shared/kernels/ltx25_cublas_sm70.py \
            models/ltx2/ltx_pipelines/distilled.py \
            models/ltx2/ltx_pipelines/ti2vid_two_stages.py \
            benchmarks/ltx25_convrot/distilled_bar73_stage_shape_fourway.py
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          "$LTX25_PYTHON" -c 'import sys; sys.path.insert(0,"benchmarks/ltx25_convrot"); import profile_gemm_t2v_i2v as p; p.check_png(); print("BAR_IMAGE_VALID",p.INPUT_IMAGE)'
          test "$(git -C stock-wangp-original rev-parse HEAD)" = c8d47da27023476777a0874300bbc9a4126acca6
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          test ! -e "$LTX25_BAR73_OUT"
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then echo "::error::V100 busy: $busy"; exit 1; fi
          nvidia-smi -L
      - name: Preflight canonical independent disable-stage flags
        shell: bash
        run: |
          set -euo pipefail
          for config in both stage2 none; do
            if [[ "$config" == both ]]; then dis1=0; dis2=0; fi
            if [[ "$config" == stage2 ]]; then dis1=1; dis2=0; fi
            if [[ "$config" == none ]]; then dis1=1; dis2=1; fi
            WAN2GP_LTX25_CUBLAS_E_MODE=fp32rot \
            WAN2GP_LTX25_E_DISABLE_4096X2048_STAGE1="$dis1" \
            WAN2GP_LTX25_E_DISABLE_4096X2048_STAGE2="$dis2" \
            "$LTX25_PYTHON" - <<'PY'
          import os
          from shared.kernels import ltx25_cublas_sm70 as e
          wanted=set()
          for phase,n in (("stage1","1"),("stage2","2")):
              if os.environ[f"WAN2GP_LTX25_E_DISABLE_4096X2048_STAGE{n}"]=="0":
                  wanted.add(phase)
          assert set(e.ENABLED_4096X2048_PHASES)==wanted
          e.set_phase("stage1");assert e._CURRENT_PHASE=="stage1"
          e.set_phase("stage2");assert e._CURRENT_PHASE=="stage2"
          assert e.MIN_M==64 and e.MAX_M==8192
          assert (4096,2048) in e.PASS_SHAPES
          print("STAGE_SELECTION_PREFLIGHT_PASS",sorted(wanted),flush=True)
          PY
          done
      - name: Run stock/off/stage2/both 73f ${{ matrix.mode }} with stock quality metrics
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/distilled_bar73_stage_shape_fourway.py \
            --mode "${{ matrix.mode }}" 2>&1 | tee "bar73-${{ matrix.mode }}-stage-shape.log"
          grep -Fq LTX25_BAR73_STAGE_SHAPE_PASS "bar73-${{ matrix.mode }}-stage-shape.log"
      - name: Upload settings, provenance, per-stage Candidate E and stock-relative metrics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bar73-${{ matrix.mode }}-candidate-e-stage-results
          retention-days: 21
          if-no-files-found: warn
          path: |
            bar73-${{ matrix.mode }}-stage-shape.log
            /cache/ltx25/results/bar73-stage-shape-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/input.json
            /cache/ltx25/results/bar73-stage-shape-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/manifest.json
            /cache/ltx25/results/bar73-stage-shape-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.json
            /cache/ltx25/results/bar73-stage-shape-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.csv
            /cache/ltx25/results/bar73-stage-shape-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/partial-results.json
            /cache/ltx25/results/bar73-stage-shape-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/results/*.json
            /cache/ltx25/results/bar73-stage-shape-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/logs/*.log
      - name: Upload four matched ${{ matrix.mode }} video/audio MP4s
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bar73-${{ matrix.mode }}-candidate-e-stage-videos
          retention-days: 21
          compression-level: 0
          if-no-files-found: warn
          path: /cache/ltx25/results/bar73-stage-shape-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/clips/*.mp4
