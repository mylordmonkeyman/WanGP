name: Distilled bar 73f T2V/I2V Stage2 vs both ABBA stock fidelity
on:
  push:
    branches: [perf/ltx25-distilled-shape-stage-i2v-t2v73-20261114]
    paths:
      - .github/workflows/ltx25-distilled-bar73-stage2-both-abba-v100.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-distilled-bar73-stage2-both-abba
  cancel-in-progress: false
jobs:
  repeated:
    name: ${{ matrix.mode }} Stage2/Both/Both/Stage2 repeated 73f
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [t2v, i2v]
    env:
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_BAR73_REPEAT_OUT: /cache/ltx25/results/bar73-stage2-both-abba-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout exact original unmodified WanGP for provenance
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: deepbeepmeep/WanGP
          ref: c8d47da27023476777a0874300bbc9a4126acca6
          path: stock-wangp-original
          persist-credentials: false
      - name: Restore legacy HDR LoRA paths for identical input config
        shell: bash
        run: |
          set -euo pipefail
          dst="stock-wangp-original/loras/ltx2"
          mkdir -p "$dst"
          while IFS= read -r -d '' file; do
            target="$dst/$(basename "$file")"
            if [[ ! -e "$target" ]]; then ln -s "$file" "$target"; fi
          done < <(find /opt/ltx25/checkpoints -type f -iname '*lora*.safetensors' -print0)
          test -L "$dst/ltx-2.5-22b-ic-lora-sdr-to-hdr-1.0.safetensors"
      - name: Check original 73f stock MP4 and input, matching image, and V100
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -m py_compile \
            benchmarks/ltx25_convrot/distilled_bar73_stage2_vs_both_abba.py \
            benchmarks/ltx25_convrot/distilled_bar73_stage_shape_fourway.py \
            models/ltx2/ltx_pipelines/distilled.py \
            shared/kernels/ltx25_cublas_sm70.py
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          "$LTX25_PYTHON" -c 'import sys; sys.path.insert(0,"benchmarks/ltx25_convrot"); import profile_gemm_t2v_i2v as p; p.check_png();print("BAR_IMAGE_VALID",p.INPUT_IMAGE)'
          test "$(git -C stock-wangp-original rev-parse HEAD)" = c8d47da27023476777a0874300bbc9a4126acca6
          reference="/cache/ltx25/results/bar73-stage-shape-${{ matrix.mode }}-43683731705-attempt1"
          test -s "$reference/clips/t2v73-01-stock_upstream.mp4"
          test -s "$reference/input.json"
          test -s "$reference/manifest.json"
          test -s "$reference/summary.json"
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          test ! -e "$LTX25_BAR73_REPEAT_OUT"
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then echo "::error::V100 busy: $busy"; exit 1; fi
      - name: Four independent runs at 73f A-B-B-A with stock-relative quality
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/distilled_bar73_stage2_vs_both_abba.py \
            --mode "${{ matrix.mode }}" 2>&1 | tee "bar73-stage2-both-abba-${{ matrix.mode }}.log"
          grep -Fq LTX25_BAR73_REPEAT_ABBA_PASS "bar73-stage2-both-abba-${{ matrix.mode }}.log"
      - name: Upload timings, routing, PSNR/SSIM, PCM SNR and reproducibility
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bar73-stage2-both-abba-${{ matrix.mode }}-results
          retention-days: 21
          if-no-files-found: warn
          path: |
            bar73-stage2-both-abba-${{ matrix.mode }}.log
            /cache/ltx25/results/bar73-stage2-both-abba-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/input.json
            /cache/ltx25/results/bar73-stage2-both-abba-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/manifest.json
            /cache/ltx25/results/bar73-stage2-both-abba-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.json
            /cache/ltx25/results/bar73-stage2-both-abba-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.csv
            /cache/ltx25/results/bar73-stage2-both-abba-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/partial-results.json
            /cache/ltx25/results/bar73-stage2-both-abba-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/results/*.json
            /cache/ltx25/results/bar73-stage2-both-abba-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/logs/*.log
      - name: Upload all four ${{ matrix.mode }} video/audio MP4s for visual review
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bar73-stage2-both-abba-${{ matrix.mode }}-videos
          retention-days: 21
          compression-level: 0
          if-no-files-found: warn
          path: /cache/ltx25/results/bar73-stage2-both-abba-${{ matrix.mode }}-${{ github.run_id }}-attempt${{ github.run_attempt }}/clips/*.mp4
