name: Distilled excluded N4096 K2048 checkpoint-backed Candidate E numerical audit
on:
  push:
    branches: [perf/ltx25-distilled-candidate-e-expansion-20261114]
    paths:
      - benchmarks/ltx25_convrot/distilled_excluded_4096x2048_audit.py
      - .github/workflows/ltx25-distilled-excluded-shape-audit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-distilled-excluded-numerical-v100
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 35
    env:
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_EXCLUDED_SHAPE_OUT: /cache/ltx25/results/distilled-excluded-shape-${{ github.run_id }}.json
      WAN2GP_LTX25_CUBLAS_E_MODE: fp32rot
      WAN2GP_LTX25_HADAMARD: radix4
      WAN2GP_LTX25_E_CAST: vector8
      WAN2GP_LTX25_E_OUTPUT: fused
      WAN2GP_LTX25_E_TEST_4096X2048: '1'
      WAN2GP_LTX25_FP16_GEMM: '1'
      LTX25_FP16_GEMM_BACKEND: direct
      LTX25_FP16_GEMM_OPS: qbytes_mm
      LTX25_FP16_GEMM_GROUPS: stage2:wide,stage2:tall,stage2:balanced
      LTX25_FP16_GEMM_MIN_M: '1'
      LTX25_FP16_GEMM_MIN_DIM: '64'
      LTX25_FP16_GEMM_GUARD: first
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout Distilled precision research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Confirm code and idle V100
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -m py_compile benchmarks/ltx25_convrot/distilled_excluded_4096x2048_audit.py
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          test ! -e "$LTX25_EXCLUDED_SHAPE_OUT"
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then echo "::error::V100 busy: $busy"; exit 1; fi
      - name: Run real checkpoint precision comparison and crossover
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}:$PWD/benchmarks/ltx25_convrot"
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/distilled_excluded_4096x2048_audit.py 2>&1 | tee excluded-shape-audit.log
          grep -Fq 'LTX25_EXCLUDED_CHECKPOINT_AUDIT_FINISHED' excluded-shape-audit.log
      - name: Save all errors, ratios and layer identifiers
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-distilled-excluded-shape-checkpoint-precision
          retention-days: 21
          if-no-files-found: warn
          path: |
            excluded-shape-audit.log
            /cache/ltx25/results/distilled-excluded-shape-${{ github.run_id }}.json
