name: Distilled fixed M64 excluded N4096 K2048 stock-reference ABBA
on:
  push:
    branches: [perf/ltx25-distilled-candidate-e-expansion-20261114]
    paths:
      - benchmarks/ltx25_convrot/distilled_fixed64_excluded_shape_abba.py
      - .github/workflows/ltx25-distilled-fixed64-excluded-shape-abba.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-distilled-fixed64-excluded-shape-abba
  cancel-in-progress: false
jobs:
  fixed64:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 40
    env:
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_DISTILLED_FIXED64_OUT: /cache/ltx25/results/distilled-fixed64-shape-${{ github.run_id }}-attempt${{ github.run_attempt }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout Distilled experimental branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify paired stock source results, model, syntax and free V100
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -m py_compile \
            benchmarks/ltx25_convrot/distilled_fixed64_excluded_shape_abba.py \
            benchmarks/ltx25_convrot/distilled_stock49_reference_psnr.py
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          test -s /cache/ltx25/results/distilled-stock49-43681488566-attempt1/clips/t2v49-01-stock_upstream.mp4
          test -s /cache/ltx25/results/distilled-stock49-43681488566-attempt1/input.json
          test ! -e "$LTX25_DISTILLED_FIXED64_OUT"
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then echo "::error::V100 busy: $busy"; exit 1; fi
      - name: Four matched 49f generations only toggling excluded weight shape
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/distilled_fixed64_excluded_shape_abba.py 2>&1 | tee distilled-fixed64-shape-abba.log
          grep -Fq LTX25_DISTILLED_FIXED64_SHAPE_ABBA_PASS distilled-fixed64-shape-abba.log
      - name: Save full timing, Candidate E shape routing, stock reference PSNR, SSIM and PCM audio
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distilled-fixed64-excluded-shape-onoff-measurements
          retention-days: 21
          if-no-files-found: warn
          path: |
            distilled-fixed64-shape-abba.log
            /cache/ltx25/results/distilled-fixed64-shape-${{ github.run_id }}-attempt${{ github.run_attempt }}/input.json
            /cache/ltx25/results/distilled-fixed64-shape-${{ github.run_id }}-attempt${{ github.run_attempt }}/manifest.json
            /cache/ltx25/results/distilled-fixed64-shape-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.json
            /cache/ltx25/results/distilled-fixed64-shape-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.csv
            /cache/ltx25/results/distilled-fixed64-shape-${{ github.run_id }}-attempt${{ github.run_attempt }}/partial-results.json
            /cache/ltx25/results/distilled-fixed64-shape-${{ github.run_id }}-attempt${{ github.run_attempt }}/results/*.json
            /cache/ltx25/results/distilled-fixed64-shape-${{ github.run_id }}-attempt${{ github.run_attempt }}/logs/*.log
      - name: Save four comparison MP4 videos
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distilled-fixed64-excluded-shape-onoff-videos
          retention-days: 21
          compression-level: 0
          if-no-files-found: warn
          path: /cache/ltx25/results/distilled-fixed64-shape-${{ github.run_id }}-attempt${{ github.run_attempt }}/clips/*.mp4
