name: Distilled 49f original stock WanGP reference PSNR and SSIM
on:
  push:
    branches: [perf/ltx25-distilled-candidate-e-expansion-20261114]
    paths:
      - .github/workflows/ltx25-distilled-stock49-reference-psnr.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-stock49-reference-20261114
  cancel-in-progress: false
jobs:
  stock49:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 35
    env:
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_STOCK49_OUT: /cache/ltx25/results/distilled-stock49-${{ github.run_id }}-attempt${{ github.run_attempt }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout optimized benchmark tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Checkout exact unmodified stock WanGP source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: deepbeepmeep/WanGP
          ref: c8d47da27023476777a0874300bbc9a4126acca6
          path: stock-wangp-original
          persist-credentials: false
      - name: Match legacy HDR LoRA links in historical stock runtime
        shell: bash
        run: |
          set -euo pipefail
          dst="stock-wangp-original/loras/ltx2"
          mkdir -p "$dst"
          while IFS= read -r -d '' file; do
            target="$dst/$(basename "$file")"
            if [[ ! -e "$target" ]]; then ln -s "$file" "$target"; fi
          done < <(find /opt/ltx25/checkpoints -type f -iname '*lora*.safetensors' -print0)
          test -L "$dst/ltx-2.5-22b-ic-lora-sdr-to-hdr-1.0.safetensors"
      - name: Verify original source and matched checkpoint, settings and GPU
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -m py_compile benchmarks/ltx25_convrot/distilled_stock49_reference_psnr.py
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          test "$(git -C stock-wangp-original rev-parse HEAD)" = c8d47da27023476777a0874300bbc9a4126acca6
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          test -d /cache/ltx25/results/distilled-minm49-43678572555-attempt1/clips
          test ! -e "$LTX25_STOCK49_OUT"
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then echo "::error::V100 busy: $busy"; exit 1; fi
      - name: Generate stock WanGP 49f and compare all retained 49f cutoff videos
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/distilled_stock49_reference_psnr.py 2>&1 | tee stock49-reference.log
          grep -Fq 'LTX25_STOCK49_REFERENCE_PASS' stock49-reference.log
      - name: Upload stock-relative PSNR, SSIM, PCM audio quality and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distilled-stock49-reference-psnr-ssim-audio
          retention-days: 21
          if-no-files-found: warn
          path: |
            stock49-reference.log
            /cache/ltx25/results/distilled-stock49-${{ github.run_id }}-attempt${{ github.run_attempt }}/input.json
            /cache/ltx25/results/distilled-stock49-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.json
            /cache/ltx25/results/distilled-stock49-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.csv
            /cache/ltx25/results/distilled-stock49-${{ github.run_id }}-attempt${{ github.run_attempt }}/logs/*.log
      - name: Upload matched stock video reference
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distilled-stock49-actual-stock-video
          retention-days: 21
          compression-level: 0
          if-no-files-found: warn
          path: /cache/ltx25/results/distilled-stock49-${{ github.run_id }}-attempt${{ github.run_attempt }}/clips/*.mp4
