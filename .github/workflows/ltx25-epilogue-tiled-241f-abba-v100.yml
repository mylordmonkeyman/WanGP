name: LTX-2.5 V100 tiled epilogue 241f T2V I2V ABBA
on:
  push:
    branches: [perf/ltx25-v100-next-optimizations-20261115]
    paths:
      - .github/workflows/ltx25-epilogue-tiled-241f-abba-v100.yml
      - benchmarks/ltx25_convrot/benchmark_tiled_epilogue_241f_abba.py
      - benchmarks/ltx25_convrot/bench_epilogue_tiling_241.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-v100-tiled-epilogue-241f-abba
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Static validation, main defaults, and matched settings
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/ltx25_convrot/benchmark_tiled_epilogue_241f_abba.py benchmarks/ltx25_convrot/bench_epilogue_tiling_241.py shared/kernels/ltx25_cublas_sm70.py
          grep -Fq 'EPILOGUE_TILED_241F_ABBA_PASS' benchmarks/ltx25_convrot/benchmark_tiled_epilogue_241f_abba.py
          grep -Fq 'WAN2GP_LTX25_E_EPILOGUE_TILED", "0"' shared/kernels/ltx25_cublas_sm70.py
          grep -Fq 'WAN2GP_LTX25_E_EPILOGUE_TILED_MAX_M", "128"' shared/kernels/ltx25_cublas_sm70.py
          grep -Fq 'four.settings(241)' benchmarks/ltx25_convrot/benchmark_tiled_epilogue_241f_abba.py
          grep -Fq 'tiled_epilogue = EPILOGUE_TILED and m <= EPILOGUE_TILED_MAX_M and n >= 2048' shared/kernels/ltx25_cublas_sm70.py
          echo EPILOGUE_TILED_241F_STATIC_PASS
  benchmark:
    needs: syntax
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 110
    env:
      PYTHONPATH: .
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_EPILOGUE_ABBA_ROOT: /cache/ltx25/results/tiled-epilogue-241f-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}
      LTX25_CUBLAS_E_LIB: /cache/ltx25/results/tiled-epilogue-241f-micro-${{ github.run_id }}/libltx25_epilogue_241.so
      LTX25_EPILOGUE_BENCH_JSON: /cache/ltx25/results/tiled-epilogue-241f-micro-${{ github.run_id }}/epilogue-241f-microbench.json
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify idle V100, model, and 1024x576 original I2V image
        shell: bash
        run: |
          set -euo pipefail
          test -x "$LTX25_PYTHON"
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          test -s benchmarks/ltx25_convrot/inputs/profile_i2v_1024x576.png.png
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          test -z "$(nvidia-smi --query-compute-apps=pid --format=csv,noheader | grep -E '[0-9]' || true)"
          nvidia-smi --query-gpu=name,clocks.gr,clocks.mem,temperature.gpu,power.draw,pstate --format=csv
      - name: Run strict 241f M=251 BF16 parity and microbench before video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$LTX25_CUBLAS_E_LIB")"
          nvcc -O3 -std=c++17 -arch=sm_70 -shared -Xcompiler -fPIC \
            benchmarks/ltx25_convrot/ltx25_cublas_e.cu -lcublas -o "$LTX25_CUBLAS_E_LIB"
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/bench_epilogue_tiling_241.py 2>&1 | tee epilogue-241f-microbench.log
          grep -Fq EPILOGUE_TILED_241F_MICROBENCH_PASS epilogue-241f-microbench.log
      - name: Run 241f T2V and I2V matched eight-generation A-B-B-A
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/benchmark_tiled_epilogue_241f_abba.py 2>&1 | tee epilogue-241f-abba.log
          grep -Fq EPILOGUE_TILED_241F_ABBA_PASS epilogue-241f-abba.log
      - name: Upload 241f quality and timing diagnostics (including partial on failure)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-epilogue-tiled-241f-abba-and-micro
          retention-days: 21
          if-no-files-found: warn
          path: |
            epilogue-241f-abba.log
            epilogue-241f-microbench.log
            /cache/ltx25/results/tiled-epilogue-241f-micro-${{ github.run_id }}/epilogue-241f-microbench.json
            /cache/ltx25/results/tiled-epilogue-241f-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/manifest.json
            /cache/ltx25/results/tiled-epilogue-241f-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/partial.json
            /cache/ltx25/results/tiled-epilogue-241f-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.json
            /cache/ltx25/results/tiled-epilogue-241f-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/results/*.json
            /cache/ltx25/results/tiled-epilogue-241f-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/logs/*.log
