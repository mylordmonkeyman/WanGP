name: LTX-2.5 V100 tiled epilogue 73f T2V I2V ABBA
on:
  push:
    branches: [perf/ltx25-v100-next-optimizations-20261115]
    paths:
      - .github/workflows/ltx25-epilogue-tiled-73f-abba-v100.yml
      - benchmarks/ltx25_convrot/benchmark_tiled_epilogue_73f_abba.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-v100-tiled-epilogue-abba
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Check 73f A-B-B-A harness
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/ltx25_convrot/benchmark_tiled_epilogue_73f_abba.py
          grep -Fq 'EPILOGUE_TILED_73F_ABBA_PASS' benchmarks/ltx25_convrot/benchmark_tiled_epilogue_73f_abba.py
          echo LTX25_EPILOGUE_ABBA_STATIC_PASS
  benchmark:
    needs: syntax
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 75
    env:
      PYTHONPATH: .
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_EPILOGUE_ABBA_ROOT: /cache/ltx25/results/tiled-epilogue-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify idle GPU and ConvRot checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test -x "$LTX25_PYTHON"
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          test -s benchmarks/ltx25_convrot/inputs/profile_i2v_1024x576.png.png
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          test -z "$(nvidia-smi --query-compute-apps=pid --format=csv,noheader | grep -E '[0-9]' || true)"
          nvidia-smi --query-gpu=name,clocks.gr,clocks.mem,temperature.gpu,power.draw,pstate --format=csv
      - name: Execute matched 73f T2V and I2V A-B-B-A controls
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/benchmark_tiled_epilogue_73f_abba.py 2>&1 | tee tiled-epilogue-73f-abba.log
          grep -Fq EPILOGUE_TILED_73F_ABBA_PASS tiled-epilogue-73f-abba.log
      - name: Upload full raw timings and fidelity artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-epilogue-tiled-73f-abba
          retention-days: 21
          if-no-files-found: warn
          path: |
            tiled-epilogue-73f-abba.log
            /cache/ltx25/results/tiled-epilogue-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/manifest.json
            /cache/ltx25/results/tiled-epilogue-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/partial.json
            /cache/ltx25/results/tiled-epilogue-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.json
            /cache/ltx25/results/tiled-epilogue-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/results/*.json
            /cache/ltx25/results/tiled-epilogue-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/logs/*.log
