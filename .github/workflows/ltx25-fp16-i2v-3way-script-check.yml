name: LTX-2.5 241-frame FP16 I2V three-arm script validation and download
on:
  push:
    branches: [perf/ltx25-convrot-sm70]
    paths:
      - .github/workflows/ltx25-fp16-i2v-3way-script-check.yml
      - run_ltx25_fp16_i2v_241_3way.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout experimental code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Validate Bash and embedded Python syntax, three cases and matched options
        shell: bash
        run: |
          set -euo pipefail
          bash -n run_ltx25_fp16_i2v_241_3way.sh
          bash run_ltx25_fp16_i2v_241_3way.sh --help | tee /tmp/i2v-help.txt
          grep -Fq 'sham, s2-all, both-all, both-all, s2-all, sham' /tmp/i2v-help.txt
          python3 - <<'PY'
          import ast, pathlib, re
          p=pathlib.Path("run_ltx25_fp16_i2v_241_3way.sh").read_text()
          for marker in ("PYSET","PYRUN","PYREPORT"):
              m=re.search(r"<<'"+marker+r"'\n(.*?)\n"+marker+r"\n",p,re.S)
              assert m, (marker,"heredoc not found")
              ast.parse(m.group(1),filename=marker+".py")
              print("PYTHON_HEREDOC_SYNTAX_PASS",marker)
          for v in ("LTX25_FP16_GEMM_BACKEND=direct","LTX25_FP16_GEMM_SHAM=1",
                    "LTX25_FP16_GEMM_MIN_M=1","LTX25_FP16_GEMM_AUDIT_PER_SHAPE=0",
                    "LTX25_FP16_GEMM_GROUPS=stage1:wide,stage1:tall",
                    "LTX25_FP16_GEMM_GROUPS=stage2:wide,stage2:tall"):
              assert v in p, v
          print("I2V_THREE_WAY_STATIC_VALIDATION_PASS")
          PY
      - name: Publish exact script for user download
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ltx25-fp16-i2v-241-three-arm-script
          retention-days: 14
          path: run_ltx25_fp16_i2v_241_3way.sh
          if-no-files-found: error
