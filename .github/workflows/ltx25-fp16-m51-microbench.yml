name: LTX-2.5 V100 real-shape M51 Quanto FP16 microbench
on:
  push:
    branches: [perf/ltx25-convrot-sm70]
    paths: [benchmarks/ltx25_convrot/fp16_m51_microbench.signal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      LTX25_FP16_MICROBENCH_PATH: /cache/ltx25/results/fp16-m51-microbench-${{ github.run_id }}.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Verify GPU free; run actual eight Quanto shapes
        shell: bash
        run: |
          set -euo pipefail
          active="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$active" ]]; then echo "::warning::GPU busy: $active"; exit 1; fi
          /opt/venvs/ltx25-cu128/bin/python benchmarks/ltx25_convrot/fp16_quanto_shapes_microbench.py 2>&1 | tee microbench.log
          grep -Fq 'QUANTO_SHAPE_MICROBENCH_FINISHED ' microbench.log
      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ltx25-quanto-all-shape-perf
          retention-days: 14
          if-no-files-found: warn
          path: |
            microbench.log
            /cache/ltx25/results/fp16-m51-microbench-${{ github.run_id }}.json
