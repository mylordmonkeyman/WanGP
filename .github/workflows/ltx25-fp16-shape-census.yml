name: LTX-2.5 V100 Quanto GEMM all-shapes census
on:
  push:
    branches: [perf/ltx25-convrot-sm70]
    paths:
      - benchmarks/ltx25_convrot/fp16_shape_census.signal
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false
jobs:
  census:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 15
    env:
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_FP16_SMOKE_ROOT: /cache/ltx25/results/fp16-shapes-${{ github.run_id }}
      LTX25_SMOKE_ONLY: sham-a1
      LTX25_SMOKE_MIN_M: '1'
      LTX25_SMOKE_MIN_DIM: '1'
      LTX25_SMOKE_SHAPE_CENSUS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Enumerate real-model BF16/INT8 Quanto GEMMs without changing outputs
        shell: bash
        run: |
          set -euo pipefail
          owners="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$owners" ]]; then echo "V100 occupied: $owners"; exit 1; fi
          "$LTX25_PYTHON" benchmarks/ltx25_convrot/selective_fp16_t2v_smoke.py 2>&1 | tee fp16-shapes.log
          "$LTX25_PYTHON" - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["LTX25_FP16_SMOKE_ROOT"])
          x=json.loads((root/"results/sham-a1-fp16-stats.json").read_text())
          shapes=x["shape_census"]
          print("GEMM_CENSUS_SUMMARY",json.dumps({
              "shape_count":len(shapes),
              "call_count":sum(r["calls"] for r in shapes),
              "top_shapes_by_flops":sorted(shapes,key=lambda r:r["total_flops"],reverse=True)[:50],
              "skip_reasons":x.get("skip_reasons"),
          }))
          assert sum(r["calls"] for r in shapes)>5000
          PY
      - name: Upload shape census and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ltx25-fp16-shape-census
          retention-days: 14
          if-no-files-found: warn
          path: |
            fp16-shapes.log
            /cache/ltx25/results/fp16-shapes-${{ github.run_id }}/results/*.json
            /cache/ltx25/results/fp16-shapes-${{ github.run_id }}/logs/*.log
