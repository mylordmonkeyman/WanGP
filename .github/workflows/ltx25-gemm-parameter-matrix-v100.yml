name: LTX-2.5 V100 isolate GEMM count changes with frames resolution and LoRA
on:
  push:
    branches: [perf/ltx25-convrot-sm70]
    paths: [benchmarks/ltx25_convrot/ltx25_gemm_parameter_matrix.signal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false
jobs:
  count:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 90
    env:
      PYTHONPATH: .
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_GEMM_MATRIX_ROOT: /cache/ltx25/results/ltx25-gemm-parameter-matrix-${{ github.run_id }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Check scripts, V100 and uploaded PNG
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python -m py_compile \
            benchmarks/ltx25_convrot/profile_gemm_parameter_matrix.py \
            benchmarks/ltx25_convrot/profile_gemm_t2v_i2v.py \
            shared/kernels/ltx25_selective_fp16_gemm.py
          test -s benchmarks/ltx25_convrot/inputs/profile_i2v_1024x576.png.png
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          nvidia-smi --query-gpu=name,memory.total,compute_cap --format=csv,noheader
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then echo "::error::V100 busy: $busy"; exit 1; fi
      - name: Isolate LoRA vs frame count vs resolution GEMM counts
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python -u benchmarks/ltx25_convrot/profile_gemm_parameter_matrix.py \
            2>&1 | tee ltx25-parameter-matrix.log
          grep -Fq 'LTX25_GEMM_PARAMETER_MATRIX_COMPLETE ' ltx25-parameter-matrix.log
      - name: Publish counts, all stage GEMM shapes and generation logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ltx25-t2v-i2v-gemm-parameter-matrix
          retention-days: 21
          if-no-files-found: warn
          path: |
            ltx25-parameter-matrix.log
            /cache/ltx25/results/ltx25-gemm-parameter-matrix-${{ github.run_id }}/matrix-comparison.txt
            /cache/ltx25/results/ltx25-gemm-parameter-matrix-${{ github.run_id }}/matrix-comparison.json
            /cache/ltx25/results/ltx25-gemm-parameter-matrix-${{ github.run_id }}/*-input.json
            /cache/ltx25/results/ltx25-gemm-parameter-matrix-${{ github.run_id }}/results/*.json
            /cache/ltx25/results/ltx25-gemm-parameter-matrix-${{ github.run_id }}/logs/*.log
