name: LTX-2.5 241-frame I2V shell benchmark syntax
on:
  push:
    branches: [perf/ltx25-convrot-sm70]
    paths:
      - run_candidate_e_fusions_i2v_241.sh
      - .github/workflows/ltx25-i2v-script-lint.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  script-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout benchmark
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bash syntax and help
        run: |
          set -euo pipefail
          bash -n run_candidate_e_fusions_i2v_241.sh
          bash run_candidate_e_fusions_i2v_241.sh --help
      - name: Compile embedded Python blocks without a GPU
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path("run_candidate_e_fusions_i2v_241.sh").read_text()
          for name in ("PYSET", "PYRUN", "PYCOMP"):
              start = src.index("<<'" + name + "'") + len("<<'" + name + "'")
              end = src.index("\n" + name + "\n", start)
              section = src[start:end]
              # Embedded Python begins after the shell heredoc opener.
              section = section.split("\n", 1)[1]
              compile(section, "embedded_" + name, "exec")
              print("PASS embedded", name)
          PY
