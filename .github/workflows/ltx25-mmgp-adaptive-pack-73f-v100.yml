name: LTX-2.5 V100 adaptive MMGP host-pack workers 73f ABBA
on:
  push:
    branches: [perf/ltx25-v100-mmgp-transfer-20261115]
    paths:
      - .github/workflows/ltx25-mmgp-adaptive-pack-73f-v100.yml
      - benchmarks/ltx25_convrot/benchmark_mmgp_adaptive_73f_abba.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-v100-adaptive-pack-73f
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Check opt-in worker policy and matched two-packed-arm test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile mmgp/offload.py benchmarks/ltx25_convrot/benchmark_mmgp_adaptive_73f_abba.py
          git diff --exit-code 8788b0479362c34e6423d331f115767ad9fe6fdc HEAD -- shared/qtypes/ benchmarks/ltx25_convrot/ltx25_cublas_e.cu shared/kernels/ltx25_cublas_sm70.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('mmgp/offload.py').read_text()
          b=Path('benchmarks/ltx25_convrot/benchmark_mmgp_adaptive_73f_abba.py').read_text()
          assert 'os.environ.get("WAN2GP_LTX25_MMGP_PACKED_ADAPTIVE8", "0") == "1"' in s
          assert 'max_workers=8 if self._ltx25_adaptive_pack else RING_COPY_THREADS' in s
          assert '_copy_runs(slot.data_ptr(), runs, self._ltx25_packed_helpers,' in s
          assert 'adaptive_workers=self._ltx25_adaptive_pack' in s
          assert '8 if size >= (16 << 20) else 4 if size >= (4 << 20) else 1' in s
          assert 'WAN2GP_LTX25_MMGP_PACKED_PRELOAD"]="1"' in b
          assert 'WAN2GP_LTX25_MMGP_PACKED_ADAPTIVE8"]="1" if adaptive else "0"' in b
          assert 'WAN2GP_LTX25_STAGE2_KEEP_CUDA_CACHE"]="0"' in b
          assert 'WAN2GP_LTX25_E_EPILOGUE_TILED"]="0"' in b
          assert 'KNOWN[mode]["video"]' in b and 'KNOWN[mode]["audio"]' in b
          assert 'four.settings(73)' in b
          assert 'LTX25_MMGP_ADAPTIVE_73F_ABBA_PASS' in b
          print('LTX25_ADAPTIVE_PACK_STATIC_PASS')
          PY
  benchmark:
    needs: static
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 70
    env:
      PYTHONPATH: .
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_MMGP_ADAPTIVE_ABBA_ROOT: /cache/ltx25/results/mmgp-adaptive-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Confirm available V100 and baseline checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test -x "$LTX25_PYTHON"
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          test -s benchmarks/ltx25_convrot/inputs/profile_i2v_1024x576.png.png
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          test -z "$(nvidia-smi --query-compute-apps=pid --format=csv,noheader | grep -E '[0-9]' || true)"
      - name: Full process eight-case T2V/I2V ABBA legacy3 vs adaptive8 workers
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/benchmark_mmgp_adaptive_73f_abba.py 2>&1 | tee mmgp-adaptive-abba.log
          grep -Fq LTX25_MMGP_ADAPTIVE_73F_ABBA_PASS mmgp-adaptive-abba.log
      - name: Upload raw logs and per-arm quality hashes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-mmgp-adaptive-workers-73f
          retention-days: 21
          if-no-files-found: warn
          path: |
            mmgp-adaptive-abba.log
            /cache/ltx25/results/mmgp-adaptive-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/manifest.json
            /cache/ltx25/results/mmgp-adaptive-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/partial.json
            /cache/ltx25/results/mmgp-adaptive-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.json
            /cache/ltx25/results/mmgp-adaptive-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/results/*.json
            /cache/ltx25/results/mmgp-adaptive-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/logs/*.log
