name: LTX-2.5 V100 MMGP consumer-wait and residency profile (73f T2V I2V)
on:
  push:
    branches: [perf/ltx25-v100-mmgp-transfer-20261115]
    paths:
      - .github/workflows/ltx25-mmgp-residency-v100.yml
      - benchmarks/ltx25_convrot/profile_mmgp_residency_bar73.py
      - benchmarks/ltx25_convrot/mmgp_residency_probe.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-v100-mmgp-residency-probe
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Verify source remains frozen and temporary overlay is exact and reversible
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/ltx25_convrot/mmgp_residency_probe.py benchmarks/ltx25_convrot/profile_mmgp_residency_bar73.py
          git diff --exit-code 8788b0479362c34e6423d331f115767ad9fe6fdc HEAD -- models/ mmgp/ shared/ wgp.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          from contextlib import contextmanager
          src = Path('benchmarks/ltx25_convrot/profile_mmgp_residency_bar73.py')
          nodes = ast.parse(src.read_text()).body
          targets = {'require','splice','temporary_mmgp_overlay'}
          body = [x for x in nodes if isinstance(x,ast.FunctionDef) and x.name in targets]
          assert len(body) == 3
          ns = {'contextmanager':contextmanager,'Path':Path,'ROOT':Path.cwd(),
                'SOURCES':('mmgp/offload.py','models/ltx2/ltx_pipelines/distilled.py')}
          exec(compile(ast.Module(body=body,type_ignores=[]),str(src),'exec'),ns)
          origins = {name:(Path.cwd()/name).read_bytes() for name in ns['SOURCES']}
          with ns['temporary_mmgp_overlay']():
              for name in ns['SOURCES']:
                  patched = (Path.cwd()/name).read_text()
                  compile(patched,name,'exec')
                  assert 'mmgp_probe.' in patched
              assert 'mmgp_probe.consumer_wait(consumer, transfer, entry_name, memory_pressure.wait)' in (Path.cwd()/ns['SOURCES'][0]).read_text()
          assert all((Path.cwd()/name).read_bytes()==data for name,data in origins.items())
          print('MMGP_SOURCE_OVERLAY_STATIC_PASS')
          PY
          echo MMGP_PROFILE_STATIC_PASS
  measure:
    needs: syntax
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_MMGP_PROBE_ROOT: /cache/ltx25/results/mmgp-residency-${{ github.run_id }}-attempt${{ github.run_attempt }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Confirm baseline device and model
        shell: bash
        run: |
          set -euo pipefail
          test -x "$LTX25_PYTHON"
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          test -s benchmarks/ltx25_convrot/inputs/profile_i2v_1024x576.png.png
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          test -z "$(nvidia-smi --query-compute-apps=pid --format=csv,noheader | grep -E '[0-9]' || true)"
          nvidia-smi --query-gpu=name,temperature.gpu,power.draw,pstate --format=csv
      - name: Capture MMGP GPU transfer, consumer stall, and preload evidence (73f T2V I2V)
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/profile_mmgp_residency_bar73.py 2>&1 | tee mmgp-residency.log
          grep -Fq LTX25_MMGP_RESIDENCY_PROBE_PASS mmgp-residency.log
      - name: Upload probe, decoded-fidelity checks, and CUDA event timings
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-mmgp-residency-73f
          retention-days: 21
          if-no-files-found: warn
          path: |
            mmgp-residency.log
            /cache/ltx25/results/mmgp-residency-${{ github.run_id }}-attempt${{ github.run_attempt }}/manifest.json
            /cache/ltx25/results/mmgp-residency-${{ github.run_id }}-attempt${{ github.run_attempt }}/partial.json
            /cache/ltx25/results/mmgp-residency-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.json
            /cache/ltx25/results/mmgp-residency-${{ github.run_id }}-attempt${{ github.run_attempt }}/results/*.json
            /cache/ltx25/results/mmgp-residency-${{ github.run_id }}-attempt${{ github.run_attempt }}/logs/*.log
