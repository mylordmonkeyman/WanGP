name: LTX-2.5 V100 73-frame original vs negative-0.4 NAD Diffusion VAE
on:
  push:
    branches: [perf/ltx25-nad-73f-two-model-20261114]
    paths:
      - benchmarks/ltx25_convrot/t2v73_nad_two_model.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false
jobs:
  nad_2way:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 35
    env:
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_NAD2_OUT: /cache/ltx25/results/nad2way73-${{ github.run_id }}-attempt${{ github.run_attempt }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout isolated WanGP test branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify existing VAE, both transformers, GPU and runner idle
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -m py_compile benchmarks/ltx25_convrot/t2v73_nad_two_model.py
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          for file in \
            /opt/ltx25/checkpoints/ltx-2.5-22b_diffusion_video_vae_bf16.safetensors \
            /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors \
            /cache/ltx25/models/ltx-2.5-22b-distilled-neg04_diffusion_model_int8_convrot.safetensors; do
            test -s "$file"
            ls -lh "$file"
          done
          test ! -e "$LTX25_NAD2_OUT"
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then echo "::error::V100 busy: $busy"; exit 1; fi
          nvidia-smi -L
      - name: Run two matched timed 73-frame NAD VAE T2V generations
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/t2v73_nad_two_model.py 2>&1 | tee nad2way73.log
          grep -Fq 'LTX25_NAD2WAY73_PASS' nad2way73.log
      - name: Upload manifest, wall-clock timings, preflights and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-nad-73f-two-model-results
          retention-days: 21
          if-no-files-found: warn
          path: |
            nad2way73.log
            /cache/ltx25/results/nad2way73-${{ github.run_id }}-attempt${{ github.run_attempt }}/manifest.json
            /cache/ltx25/results/nad2way73-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.json
            /cache/ltx25/results/nad2way73-${{ github.run_id }}-attempt${{ github.run_attempt }}/inputs/*.json
            /cache/ltx25/results/nad2way73-${{ github.run_id }}-attempt${{ github.run_attempt }}/results/*.json
            /cache/ltx25/results/nad2way73-${{ github.run_id }}-attempt${{ github.run_attempt }}/logs/*.log
      - name: Upload both generated 73-frame comparison videos
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-nad-73f-two-model-videos
          retention-days: 21
          compression-level: 0
          if-no-files-found: warn
          path: /cache/ltx25/results/nad2way73-${{ github.run_id }}-attempt${{ github.run_attempt }}/clips/*.mp4
