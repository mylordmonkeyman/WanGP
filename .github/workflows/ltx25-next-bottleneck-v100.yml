name: LTX-2.5 V100 73f next-cycle bottleneck attribution
on:
  push:
    branches: [perf/ltx25-v100-next-optimizations-20261115]
    paths:
      - .github/workflows/ltx25-next-bottleneck-v100.yml
      - benchmarks/ltx25_convrot/profile_next_cycle_bar73.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-next-cycle-v100-profile
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Verify profiling is a self-contained external harness and main remains untouched
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/ltx25_convrot/profile_next_cycle_bar73.py
          git diff --exit-code 523cb6f8cf3aeca2daa38a61a3d7e81c01c61c43 HEAD -- shared/ models/ mmgp/ wgp.py
          grep -Fq 'WAN2GP_LTX25_PIPELINE_PROFILE' benchmarks/ltx25_convrot/profile_next_cycle_bar73.py
          grep -Fq 'TRACE_ATTRIBUTION' benchmarks/ltx25_convrot/profile_next_cycle_bar73.py
          echo LTX25_NEXT_PROFILE_STATIC_PASS
  measure:
    needs: syntax
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 110
    env:
      PYTHONPATH: .
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_NEXT_PROFILE_ROOT: /cache/ltx25/results/next-profile-${{ github.run_id }}-attempt${{ github.run_attempt }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Verify idle SM70 GPU and pinned checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test -x "$LTX25_PYTHON"
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          test -s benchmarks/ltx25_convrot/inputs/profile_i2v_1024x576.png.png
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          "$LTX25_PYTHON" -m py_compile benchmarks/ltx25_convrot/profile_next_cycle_bar73.py
          nvidia-smi -L
          nvidia-smi --query-gpu=name,clocks.gr,clocks.mem,temperature.gpu,power.draw,pstate --format=csv || true
          nvidia-smi -q -d PCI | head -70 || true
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then
            echo "::error::V100 busy: $busy"
            exit 1
          fi
      - name: Run main-equivalent T2V and I2V normal baseline followed by sampled profiles
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/profile_next_cycle_bar73.py 2>&1 | tee next-profile.log
          grep -Fq LTX25_NEXT_PROFILE_PASS next-profile.log
      - name: Upload performance and CUDA trace evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ltx25-next-cycle-73f-t2v-i2v-bottleneck
          retention-days: 21
          if-no-files-found: warn
          path: |
            next-profile.log
            /cache/ltx25/results/next-profile-${{ github.run_id }}-attempt${{ github.run_attempt }}/manifest.json
            /cache/ltx25/results/next-profile-${{ github.run_id }}-attempt${{ github.run_attempt }}/partial.json
            /cache/ltx25/results/next-profile-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.json
            /cache/ltx25/results/next-profile-${{ github.run_id }}-attempt${{ github.run_attempt }}/results/*.json
            /cache/ltx25/results/next-profile-${{ github.run_id }}-attempt${{ github.run_attempt }}/logs/*.log
            /cache/ltx25/results/next-profile-${{ github.run_id }}-attempt${{ github.run_attempt }}/settings/*.json
