name: LTX-2.5 V100 non-Quanto BF16 vs transient FP16 GEMM shapes
on:
  push:
    branches: [perf/ltx25-convrot-sm70]
    paths: [benchmarks/ltx25_convrot/nonquanto_gemm_microbench.signal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false
jobs:
  microbench:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 25
    env:
      LTX25_NONQUANTO_BENCH_ROOT: /cache/ltx25/results/nonquanto-fp16-microbench-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Validate benchmark and free V100
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python -m py_compile benchmarks/ltx25_convrot/non_quanto_gemm_fp16_microbench.py
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then echo "::error::V100 busy $busy"; exit 1; fi
      - name: Timed BF16 native vs transient FP16 GEMM plus error microbench
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python -u benchmarks/ltx25_convrot/non_quanto_gemm_fp16_microbench.py \
            2>&1 | tee nonquanto-gemm-microbench.log
          grep -Fq 'NONQUANTO_GEMM_MICROBENCH_PASS ' nonquanto-gemm-microbench.log
      - name: Publish measured GPU time, numerical differences, actual shape weights
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ltx25-v100-nonquanto-dense-GEMM-microbench
          retention-days: 21
          if-no-files-found: warn
          path: |
            nonquanto-gemm-microbench.log
            /cache/ltx25/results/nonquanto-fp16-microbench-${{ github.run_id }}/microbench.json
            /cache/ltx25/results/nonquanto-fp16-microbench-${{ github.run_id }}/microbench.csv
