name: LTX-2.5 V100 1024x576 matched video quality

# Manual only. The complete checkpoint Docker image must be installed before
# starting either run. GPU jobs cannot fetch or SHA256 any safetensors files.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Choose the full model run (R0 first, then experimental E)'
        type: choice
        required: true
        default: r0_quality_1024
        options:
          - r0_quality_1024
          - e_quality_1024

permissions:
  contents: write

concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false

jobs:
  quality:
    name: 1024x576 LTX-2.5 single matched run
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 180
    env:
      LTX25_BENCH_VARIANT: ${{ inputs.variant }}
      LTX25_CHECKPOINT_ROOT: /opt/ltx25/checkpoints
      LTX25_CUBLAS_E_LIB: /tmp/libltx25_cublas_e_quality.so
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout benchmark code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate selected V100 and image-baked checkpoint manifest (no hash or download)
        shell: bash
        run: |
          set -euo pipefail
          test "$(nvidia-smi --query-gpu=uuid --format=csv,noheader | wc -l)" -eq 1
          nvidia-smi -L
          test "$LTX25_CHECKPOINT_ROOT" = /opt/ltx25/checkpoints
          test -f /opt/ltx25/model-image-manifest.json
          test -x /opt/venvs/ltx25-cu128/bin/python
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/runtime_validate_baked.py

      - name: Set explicit ConvRot pilot mode (never auto-select)
        shell: bash
        run: |
          set -euo pipefail
          case "$LTX25_BENCH_VARIANT" in
            r0_quality_1024)
              echo "WAN2GP_LTX25_CUBLAS_E_MODE=" >> "$GITHUB_ENV"
              ;;
            e_quality_1024)
              echo "WAN2GP_LTX25_CUBLAS_E_MODE=fp32rot" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Invalid LTX25_BENCH_VARIANT: $LTX25_BENCH_VARIANT" >&2
              exit 1
              ;;
          esac

      - name: Compile SM70 cuBLAS adapter only for Candidate E
        if: ${{ inputs.variant == 'e_quality_1024' }}
        shell: bash
        run: |
          set -euo pipefail
          nvcc -O3 -std=c++17 -arch=sm_70 -shared -Xcompiler -fPIC \
            benchmarks/ltx25_convrot/ltx25_cublas_e.cu \
            -lcublas -o "$LTX25_CUBLAS_E_LIB"
          test -s "$LTX25_CUBLAS_E_LIB"

      - name: Synthetic adapter/shape preflight only for Candidate E
        if: ${{ inputs.variant == 'e_quality_1024' }}
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/candidate_adapter_preflight.py

      - name: Generate one 49-frame 1024x576 video offline from baked weights
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/wgp_baseline.py

      - name: Publish quality result independently of 576x320 baseline
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/ltx25_convrot/publish_quality_status.py

      - name: Gate newly generated quality video, and actual Candidate E calls
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          variant = os.environ["LTX25_BENCH_VARIANT"]
          suffix = {"r0_quality_1024":"quality_r0","e_quality_1024":"quality_e"}[variant]
          sha = os.environ["GITHUB_SHA"][:12]
          path = Path("/cache/ltx25/results")/f"runtime_{suffix}_{sha}.json"
          assert path.is_file(), f"Result report absent: {path}"
          r = json.loads(path.read_text())
          print("QUALITY_GATES",r.get("status"),r.get("resolution"),r.get("candidate_counters"))
          assert r.get("status") == "PASS", r.get("blocker", r.get("error", "Incomplete run"))
          assert r.get("resolution") == "1024x576"
          assert len(r.get("videos", [])) == 1
          if variant == "e_quality_1024":
              assert r.get("candidate_counters",{}).get("used",0) > 0, "No Candidate E calls"
          PY
