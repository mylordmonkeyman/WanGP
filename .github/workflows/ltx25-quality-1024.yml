name: LTX-2.5 V100 1024x576 matched video quality

# No model downloads or runtime SHA256. This workflow requires the immutable
# checkpoint-complete runner image; source-code pushes never auto-start a job.
on:
  push:
    branches:
      - perf/ltx25-convrot-sm70
    paths:
      - benchmarks/ltx25_convrot/quality_r0_dispatch.signal
      - benchmarks/ltx25_convrot/quality_e_dispatch.signal
      - benchmarks/ltx25_convrot/real_activation_audit_dispatch.signal
      - benchmarks/ltx25_convrot/stage_profile_dispatch.signal
      - benchmarks/ltx25_convrot/workspace_dispatch.signal
      - benchmarks/ltx25_convrot/cast4_dispatch.signal
      - benchmarks/ltx25_convrot/combo_dispatch.signal
      - benchmarks/ltx25_convrot/default_auto_dispatch.signal
      - benchmarks/ltx25_convrot/hadamard_video_dispatch.signal
      - benchmarks/ltx25_convrot/flat_mm_video_dispatch.signal
      - benchmarks/ltx25_convrot/debug_explicit_dispatch.signal
  workflow_dispatch:
    inputs:
      variant:
        description: 'One matched run: R0 first, experimental E second'
        type: choice
        required: true
        default: r0_quality_1024
        options:
          - r0_quality_1024
          - e_quality_1024
          - e_real_activation_audit_1024
          - e_profile_1024
          - e_workspace_1024
          - e_cast4_1024
          - e_combo_1024
          - e_default_1024
          - e_hadamard_1024
          - e_flat_mm_1024
          - e_debug_fp32rot_samecfg_1024

permissions:
  contents: write

concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false

jobs:
  quality:
    name: 1024x576 LTX-2.5 one matched run
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 180
    env:
      LTX25_BENCH_VARIANT: ${{ inputs.variant || 'r0_quality_1024' }}
      LTX25_CHECKPOINT_ROOT: /opt/ltx25/checkpoints
      LTX25_CUBLAS_E_LIB: /tmp/libltx25_cublas_e_quality.so
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout exact benchmark code and signal commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Resolve branch-specific push signal variant
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD |
              grep -E '^benchmarks/ltx25_convrot/(quality_(r0|e)|real_activation_audit|stage_profile|workspace|cast4|combo|default_auto|debug_explicit|hadamard_video|flat_mm_video)_dispatch[.]signal$' || true)"
            case "$changed" in
              benchmarks/ltx25_convrot/quality_r0_dispatch.signal)
                echo "LTX25_BENCH_VARIANT=r0_quality_1024" >> "$GITHUB_ENV"
                ;;
              benchmarks/ltx25_convrot/quality_e_dispatch.signal)
                echo "LTX25_BENCH_VARIANT=e_quality_1024" >> "$GITHUB_ENV"
                ;;
              benchmarks/ltx25_convrot/real_activation_audit_dispatch.signal)
                echo "LTX25_BENCH_VARIANT=e_real_activation_audit_1024" >> "$GITHUB_ENV"
                ;;
              benchmarks/ltx25_convrot/stage_profile_dispatch.signal)
                echo "LTX25_BENCH_VARIANT=e_profile_1024" >> "$GITHUB_ENV"
                ;;
              benchmarks/ltx25_convrot/workspace_dispatch.signal)
                echo "LTX25_BENCH_VARIANT=e_workspace_1024" >> "$GITHUB_ENV"
                ;;
              benchmarks/ltx25_convrot/cast4_dispatch.signal)
                echo "LTX25_BENCH_VARIANT=e_cast4_1024" >> "$GITHUB_ENV"
                ;;
              benchmarks/ltx25_convrot/combo_dispatch.signal)
                echo "LTX25_BENCH_VARIANT=e_combo_1024" >> "$GITHUB_ENV"
                ;;
              benchmarks/ltx25_convrot/default_auto_dispatch.signal)
                echo "LTX25_BENCH_VARIANT=e_default_1024" >> "$GITHUB_ENV"
                ;;
              benchmarks/ltx25_convrot/hadamard_video_dispatch.signal)
                echo "LTX25_BENCH_VARIANT=e_hadamard_1024" >> "$GITHUB_ENV"
                ;;
              benchmarks/ltx25_convrot/flat_mm_video_dispatch.signal)
                echo "LTX25_BENCH_VARIANT=e_flat_mm_1024" >> "$GITHUB_ENV"
                ;;
              benchmarks/ltx25_convrot/debug_explicit_dispatch.signal)
                echo "LTX25_BENCH_VARIANT=e_debug_fp32rot_samecfg_1024" >> "$GITHUB_ENV"
                ;;
              *)
                echo "Expected exactly one quality dispatch signal, got: $changed" >&2
                exit 1
                ;;
            esac
          fi

      - name: Guard GPU ownership before any CUDA-consuming preflight
        shell: bash
        run: |
          set -euo pipefail
          owners="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader)"
          active="$(printf '%s\n' "$owners" | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$active" ]]; then
            echo "::warning::V100 is in use by another compute process; refusing GPU work."
            printf '%s\n' "$active"
            exit 1
          fi

      - name: Verify SM70 GPU and baked checkpoint manifest (no hash or download)
        shell: bash
        run: |
          set -euo pipefail
          test "$(nvidia-smi --query-gpu=uuid --format=csv,noheader | wc -l)" -eq 1
          nvidia-smi -L
          test "$LTX25_CHECKPOINT_ROOT" = /opt/ltx25/checkpoints
          test -f /opt/ltx25/model-image-manifest.json
          test -x /opt/venvs/ltx25-cu128/bin/python
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/runtime_validate_baked.py

      - name: Set explicit ConvRot pilot mode (never auto-select)
        shell: bash
        run: |
          set -euo pipefail
          case "$LTX25_BENCH_VARIANT" in
            r0_quality_1024)
              echo "WAN2GP_LTX25_CUBLAS_E_MODE=" >> "$GITHUB_ENV"
              ;;
            e_quality_1024|e_real_activation_audit_1024|e_profile_1024|e_workspace_1024|e_cast4_1024|e_combo_1024|e_debug_fp32rot_samecfg_1024|e_hadamard_1024|e_flat_mm_1024)
              echo "WAN2GP_LTX25_CUBLAS_E_MODE=fp32rot" >> "$GITHUB_ENV"
              ;;
            e_default_1024)
              # Do not set an override: verify the automatic default.
              echo "Testing unconfigured SM70 ConvRot default" 
              ;;
            *)
              echo "Unsupported variant: $LTX25_BENCH_VARIANT" >&2
              exit 1
              ;;
          esac

      - name: Compile SM70 cuBLAS adapter for Candidate E only
        if: ${{ env.LTX25_BENCH_VARIANT != 'r0_quality_1024' }}
        shell: bash
        run: |
          set -euo pipefail
          nvcc -O3 -std=c++17 -arch=sm_70 -shared -Xcompiler -fPIC \
            benchmarks/ltx25_convrot/ltx25_cublas_e.cu \
            -lcublas -o "$LTX25_CUBLAS_E_LIB"
          test -s "$LTX25_CUBLAS_E_LIB"

      - name: Preflight BF16 and FP16 adapter numerical gates for Candidate E
        if: ${{ env.LTX25_BENCH_VARIANT != 'r0_quality_1024' && env.LTX25_BENCH_VARIANT != 'e_default_1024' }}
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/candidate_adapter_preflight.py

      - name: Preflight default-on SM70 without any opt-in or prebuilt library
        if: ${{ env.LTX25_BENCH_VARIANT == 'e_default_1024' }}
        shell: bash
        run: |
          set -euo pipefail
          env -u WAN2GP_LTX25_CUBLAS_E_MODE \
              -u WAN2GP_LTX25_E_CAST -u WAN2GP_LTX25_E_WORKSPACE \
              -u LTX25_CUBLAS_E_LIB -u WAN2GP_LTX25_E_AUTO_BUILD \
            /opt/venvs/ltx25-cu128/bin/python \
              benchmarks/ltx25_convrot/default_auto_preflight.py

      - name: Preflight opt-in bounded workspace and stream safety
        if: ${{ env.LTX25_BENCH_VARIANT == 'e_workspace_1024' || env.LTX25_BENCH_VARIANT == 'e_combo_1024' }}
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/candidate_workspace_preflight.py

      - name: Preflight vector4 exact FP16 cast for BF16 and FP16 inputs
        if: ${{ env.LTX25_BENCH_VARIANT == 'e_cast4_1024' || env.LTX25_BENCH_VARIANT == 'e_combo_1024' }}
        shell: bash
        run: |
          set -euo pipefail
          WAN2GP_LTX25_E_CAST=vector4 \
            /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/candidate_cast4_preflight.py

      - name: Preflight FP32 radix4 Hadamard against full torch-rotation adapter
        if: ${{ env.LTX25_BENCH_VARIANT == 'e_hadamard_1024' || env.LTX25_BENCH_VARIANT == 'e_flat_mm_1024' }}
        shell: bash
        run: |
          set -euo pipefail
          WAN2GP_LTX25_HADAMARD=radix4 \
            /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/candidate_hadamard_preflight.py

      - name: Require flattened FP32 torch.mm full-adapter output bit-exactness
        if: ${{ env.LTX25_BENCH_VARIANT == 'e_flat_mm_1024' }}
        shell: bash
        run: |
          set -euo pipefail
          WAN2GP_LTX25_HADAMARD=flat_mm \
            /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/candidate_flat_mm_preflight.py

      - name: Generate one 49-frame 1024x576 video offline from baked weights
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/wgp_baseline.py

      - name: Require experimental video to match validated no-sync E decoded frames
        if: ${{ env.LTX25_BENCH_VARIANT == 'e_workspace_1024' || env.LTX25_BENCH_VARIANT == 'e_cast4_1024' || env.LTX25_BENCH_VARIANT == 'e_combo_1024' || env.LTX25_BENCH_VARIANT == 'e_default_1024' || env.LTX25_BENCH_VARIANT == 'e_debug_fp32rot_samecfg_1024' || env.LTX25_BENCH_VARIANT == 'e_hadamard_1024' }}
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/workspace_video_gate.py

      - name: Publish quality result independently from original baseline
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/ltx25_convrot/publish_quality_status.py

      - name: Assert completed new output and Candidate E calls if selected
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          variant = os.environ["LTX25_BENCH_VARIANT"]
          suffix = {"r0_quality_1024": "quality_r0", "e_quality_1024": "quality_e",
                    "e_real_activation_audit_1024": "quality_real_audit",
                    "e_profile_1024": "quality_stage_profile",
                    "e_workspace_1024": "quality_workspace",
                    "e_cast4_1024": "quality_cast4",
                    "e_combo_1024": "quality_combo",
                    "e_default_1024": "quality_default",
                    "e_hadamard_1024": "quality_hadamard",
                    "e_flat_mm_1024": "quality_flat_mm",
                    "e_debug_fp32rot_samecfg_1024": "quality_default_explicit"}[variant]
          sha = os.environ["GITHUB_SHA"][:12]
          path = Path("/cache/ltx25/results") / f"runtime_{suffix}_{sha}.json"
          assert path.is_file(), f"Result report missing: {path}"
          r = json.loads(path.read_text())
          print("QUALITY_GATE", r.get("status"), r.get("resolution"), r.get("candidate_counters"))
          assert r.get("status") == "PASS", r.get("blocker", r.get("error", "Incomplete generation"))
          assert r.get("resolution") == "1024x576"
          assert len(r.get("videos", [])) == 1, "Expected one new quality video"
          if variant != "r0_quality_1024":
              assert r.get("candidate_counters", {}).get("used", 0) > 0, "No Candidate E calls"
          if variant == "e_debug_fp32rot_samecfg_1024":
              counters = r.get("candidate_counters") or {}
              gate = r.get("debug_explicit_video_gate") or {}
              print("DEBUG_EXPLICIT_GATE", counters.get("mode"), counters.get("used"), gate)
              assert counters.get("mode") == "fp32rot" and counters.get("cast_mode") == "vector4"
              assert r.get("workspace_stats", {}).get("acquired", 0) > 0
              assert gate.get("total_frames") == 49
              # Exact mismatch is an observed diagnostic, not an infrastructure
              # failure. Do not claim promotion when mismatched.
          if variant == "e_flat_mm_1024":
              counters = r.get("candidate_counters") or {}
              gate = r.get("flat_mm_video_gate") or {}
              print("FLAT_MM_QUALITY_GATE", counters.get("rotation_mode"), gate)
              assert counters.get("rotation_mode") == "flat_mm"
              assert counters.get("used") == 16368
              assert counters.get("range_fallback") == 4434
              assert r.get("workspace_stats", {}).get("persistent_weight_copies") == 0
              assert gate.get("total_frames") == 49
              assert gate.get("decoded_pixels_identical") is True, "Flat FP32 mm altered decoded frames"
          if variant == "e_hadamard_1024":
              counters = r.get("candidate_counters") or {}
              gate = r.get("hadamard_video_gate") or {}
              print("HADAMARD_QUALITY_GATE", counters.get("rotation_mode"), gate)
              assert counters.get("rotation_mode") == "radix4"
              assert counters.get("used") == 16368, "H256 changed number of eligible calls"
              assert r.get("workspace_stats", {}).get("persistent_weight_copies") == 0
              assert gate.get("total_frames") == 49, "Incorrect decoded frame count"
              assert gate.get("decoded_pixels_identical") is True, "H256 video differs from validated E"
          if variant == "e_default_1024":
              counters = r.get("candidate_counters") or {}
              stats = r.get("workspace_stats") or {}
              gate = r.get("default_video_gate") or {}
              print("DEFAULT_AUTO_GATE", counters.get("mode"), counters.get("cast_mode"),
                    stats.get("acquired"), gate.get("status"))
              assert counters.get("mode") == "fp32rot" and counters.get("auto_selected") is True
              assert counters.get("cast_mode") == "vector4"
              assert counters.get("auto_native_fallback") == 0, "Auto extension unavailable"
              assert counters.get("used") == 16368, "Default dispatch changed eligible call count"
              assert counters.get("range_fallback") == 4434, "Device FP32 fallback count changed"
              assert stats.get("acquired") == 16360, "Default scratch lease count changed"
              assert stats.get("persistent_weight_copies") == 0
              assert gate.get("decoded_pixels_identical") is True and gate.get("total_frames") == 49
          if variant == "e_combo_1024":
              stats = r.get("workspace_stats") or {}
              assert stats.get("acquired", 0) > 0, "Combination never reused scratch"
              assert stats.get("max_persistent_bytes", 0) <= 96 * (1 << 20)
              assert stats.get("persistent_weight_copies") == 0
              assert r.get("candidate_counters", {}).get("cast_mode") == "vector4"
              gate = r.get("combo_video_gate") or {}
              print("COMBO_VIDEO_GATE", gate)
              assert gate.get("decoded_pixels_identical") is True, "Combination changed decoded frames"
              assert gate.get("total_frames") == 49
          if variant == "e_cast4_1024":
              assert r.get("candidate_counters", {}).get("cast_mode") == "vector4", "Vector4 cast did not execute"
              gate = r.get("cast4_video_gate") or {}
              print("CAST4_VIDEO_GATE", gate)
              assert gate.get("decoded_pixels_identical") is True, "Vector4 clip differs from validated E"
              assert gate.get("total_frames") == 49, "Incorrect video frame count"
          if variant == "e_workspace_1024":
              stats = r.get("workspace_stats") or {}
              print("WORKSPACE_GATE", stats)
              assert stats.get("acquired", 0) > 0, "No bounded scratch reuse"
              assert stats.get("max_persistent_bytes", 0) <= 96 * (1 << 20), "Scratch cap exceeded"
              assert stats.get("persistent_weight_copies") == 0, "FP16 weight cached persistently"
              gate = r.get("workspace_video_gate") or {}
              print("WORKSPACE_VIDEO_GATE", gate)
              assert gate.get("decoded_pixels_identical") is True, "Workspace clip differs from established E"
              assert gate.get("total_frames") == 49, "Incorrect video frame count"
          if variant == "e_profile_1024":
              profile = r.get("stage_profile") or {}
              print("STAGE_PROFILE_GATE", profile.get("status"),
                    profile.get("sample_count"), profile.get("by_shape"))
              assert profile.get("real_model_activations") is True, "No live model profile"
              assert profile.get("sample_count", 0) >= 14, "Too few stage profile samples"
              assert profile.get("status") == "PASS", "Incomplete stage profile"
          if variant == "e_real_activation_audit_1024":
              audit = r.get("real_activation_audit") or {}
              print("REAL_ACTIVATION_GATE", audit.get("status"),
                    audit.get("total_samples"), audit.get("by_shape"))
              assert audit.get("real_model_activations") is True, "No real activations observed"
              assert audit.get("total_samples", 0) >= 7, "Too few real-activation samples"
              assert audit.get("status") == "PASS", "R0/R1/Candidate E accuracy gate failed"
          PY
