name: LTX-2.5 V100 241-frame I2V release wall-time A/B rerun
on:
  push:
    branches: [perf/ltx25-release-walltime-ab-20261114]
    paths:
      - .github/workflows/ltx25-release-i2v241-rerun-v100.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false
jobs:
  i2v-241-abba:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 180
    env:
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_RELEASE_AB_ROOT: /cache/ltx25/results/release-ab-241-rerun-${{ github.run_id }}
      LTX25_RELEASE_COHORTS: i2v241
      LTX25_RELEASE_DIAGNOSTICS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout fixed release benchmark and original comparison code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check exact V100 and required cached checkpoint/image
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -m py_compile \
            benchmarks/ltx25_convrot/release_walltime_ab.py \
            shared/kernels/ltx25_selective_fp16_gemm.py
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7, 0)'
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          test -s benchmarks/ltx25_convrot/inputs/profile_i2v_1024x576.png.png
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader |
            grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then
            echo "::error::V100 occupied: $busy"
            exit 1
          fi
      - name: Rerun only 241-frame I2V Candidate E vs Stage2 direct FP16 ABBA, then separate profiles
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/release_walltime_ab.py \
            2>&1 | tee release-i2v241-abba-rerun.log
          grep -Fq 'LTX25_RELEASE_AB_PASS' release-i2v241-abba-rerun.log
      - name: Publish 241-frame results, wall times, dispatch counts and separate stage profiles
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ltx25-i2v241-release-abba-rerun-results
          retention-days: 21
          if-no-files-found: warn
          path: |
            release-i2v241-abba-rerun.log
            /cache/ltx25/results/release-ab-241-rerun-${{ github.run_id }}/manifest.json
            /cache/ltx25/results/release-ab-241-rerun-${{ github.run_id }}/summary.json
            /cache/ltx25/results/release-ab-241-rerun-${{ github.run_id }}/summary.csv
            /cache/ltx25/results/release-ab-241-rerun-${{ github.run_id }}/results/*.json
            /cache/ltx25/results/release-ab-241-rerun-${{ github.run_id }}/settings/*.json
            /cache/ltx25/results/release-ab-241-rerun-${{ github.run_id }}/logs/*.log
      - name: Publish 241-frame head-to-head videos
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ltx25-i2v241-release-abba-rerun-clips
          retention-days: 21
          if-no-files-found: warn
          compression-level: 0
          path: /cache/ltx25/results/release-ab-241-rerun-${{ github.run_id }}/clips/*.mp4
