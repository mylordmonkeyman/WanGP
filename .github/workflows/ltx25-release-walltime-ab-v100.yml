name: LTX-2.5 V100 release-style wall-to-wall Stage2 FP16 vs Candidate E ABBA
on:
  push:
    branches: [perf/ltx25-release-walltime-ab-20261114]
    paths:
      - .github/workflows/ltx25-release-walltime-ab-v100.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Check benchmark and modified dispatcher without importing CUDA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/ltx25_convrot/release_walltime_ab.py shared/kernels/ltx25_selective_fp16_gemm.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('benchmarks/ltx25_convrot/release_walltime_ab.py').read_text()
          d=Path('shared/kernels/ltx25_selective_fp16_gemm.py').read_text()
          assert '"t2v49"' in p and '"i2v49"' in p and '"i2v241"' in p
          assert 'ARMS = ("prior", "stage2", "stage2", "prior")' in p
          assert '"WAN2GP_LTX25_FP16_GEMM": "1"' in p
          assert '"WAN2GP_LTX25_PIPELINE_PROFILE": "1"' in p
          assert '"WAN2GP_LTX25_FP16_GEMM"] = "0"' in p
          assert '_COUNTS["bypassed_unselected_" + _CURRENT_PHASE + "_forwards"]' in d
          print('RELEASE_AB_STATIC_PASS')
          PY
  benchmark:
    needs: syntax
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 220
    env:
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_RELEASE_AB_ROOT: /cache/ltx25/results/release-ab-${{ github.run_id }}
      LTX25_RELEASE_COHORTS: t2v49,i2v49,i2v241
      LTX25_RELEASE_DIAGNOSTICS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout exact pinned benchmark code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Verify correct V100 and offline baked model with no competing GPU process
        shell: bash
        run: |
          set -euo pipefail
          test -x "$LTX25_PYTHON"
          test -s benchmarks/ltx25_convrot/inputs/profile_i2v_1024x576.png.png
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          "$LTX25_PYTHON" -m py_compile benchmarks/ltx25_convrot/release_walltime_ab.py shared/kernels/ltx25_selective_fp16_gemm.py
          nvidia-smi -L
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then
            echo "::error::V100 occupied; release timing would be invalid: $busy"
            exit 1
          fi
      - name: Run full-process T2V49 I2V49 I2V241 ABBA, then separate detailed stage profiles
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/release_walltime_ab.py 2>&1 | tee release-walltime-ab.log
          grep -Fq "LTX25_RELEASE_AB_PASS" release-walltime-ab.log
      - name: Upload matched wall-time timings, phase profiles and per-case evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ltx25-release-style-walltime-ab-results
          retention-days: 21
          if-no-files-found: warn
          path: |
            release-walltime-ab.log
            /cache/ltx25/results/release-ab-${{ github.run_id }}/manifest.json
            /cache/ltx25/results/release-ab-${{ github.run_id }}/summary.json
            /cache/ltx25/results/release-ab-${{ github.run_id }}/summary.csv
            /cache/ltx25/results/release-ab-${{ github.run_id }}/results/*.json
            /cache/ltx25/results/release-ab-${{ github.run_id }}/settings/*.json
            /cache/ltx25/results/release-ab-${{ github.run_id }}/logs/*.log
      - name: Upload reference and Stage 2 FP16 videos for visual review
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ltx25-release-style-t2v-i2v-matched-clips
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
          path: /cache/ltx25/results/release-ab-${{ github.run_id }}/clips/*.mp4
