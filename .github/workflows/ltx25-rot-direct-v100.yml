name: LTX-2.5 V100 direct BF16/FP16 radix4 Candidate E preflight

on:
  push:
    branches: [perf/ltx25-convrot-sm70]
    paths:
      - benchmarks/ltx25_convrot/rot_direct_dispatch.signal
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ltx25-rot-direct-v100
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 40
    env:
      LTX25_CUBLAS_E_LIB: /tmp/libltx25_rot_direct_v100.so
      WAN2GP_LTX25_CUBLAS_E_MODE: fp32rot
      WAN2GP_LTX25_E_CAST: vector8
      WAN2GP_LTX25_HADAMARD: radix4
      WAN2GP_LTX25_ROT_INPUT: direct
      WAN2GP_LTX25_E_WORKSPACE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONPATH: .
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Compile SM70 exact-input fused radix4 and cuBLAS Candidate E
        shell: bash
        run: |
          set -euo pipefail
          nvcc -O3 -std=c++17 -arch=sm_70 -shared -Xcompiler -fPIC \
            benchmarks/ltx25_convrot/ltx25_cublas_e.cu \
            -lcublas -o "$LTX25_CUBLAS_E_LIB"
          test -s "$LTX25_CUBLAS_E_LIB"

      - name: Guard V100 ownership before any CUDA work
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi -L
          active="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader |
            grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$active" ]]; then
            echo "::warning::GPU is busy; not running shared V100 benchmark"
            printf '%s\n' "$active"
            exit 1
          fi
          test -x /opt/venvs/ltx25-cu128/bin/python

      - name: Test FP32 bit-exactness and performance on V100
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/rot_direct_preflight.py \
            2>&1 | tee rot-direct-preflight.log

      - name: Store diagnostic output
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ltx25-rot-direct-preflight
          path: rot-direct-preflight.log
          if-no-files-found: ignore
