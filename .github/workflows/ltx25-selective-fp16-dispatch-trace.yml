name: LTX-2.5 V100 validate Quanto FP16 GEMM interception
on:
  push:
    branches: [perf/ltx25-convrot-sm70]
    paths: [benchmarks/ltx25_convrot/fp16_trace_dispatch.signal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false
jobs:
  trace:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 15
    env:
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_FP16_SMOKE_ROOT: /cache/ltx25/results/selective-fp16-trace-${{ github.run_id }}
      LTX25_SMOKE_ONLY: fp16-b1
      LTX25_SMOKE_DISPATCH_TRACE: '0'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Check GPU available, trace one real transformer run
        shell: bash
        run: |
          set -euo pipefail
          active="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$active" ]]; then echo "GPU busy: $active" >&2; exit 1; fi
          "$LTX25_PYTHON" benchmarks/ltx25_convrot/selective_fp16_t2v_smoke.py 2>&1 | tee fp16-trace.log
          "$LTX25_PYTHON" - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["LTX25_FP16_SMOKE_ROOT"])
          p=root/"results/fp16-b1-fp16-stats.json"
          d=json.loads(p.read_text())
          print("FP16_RESULT",json.dumps({k:d.get(k) for k in ("transformer_forward_calls","torch_dispatch_ops_seen","top_aten_dispatch_ops","skip_reasons","stats","by_shape")},sort_keys=True))
          PY
      - name: Publish trace diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selective-fp16-live-dispatch-trace
          retention-days: 14
          if-no-files-found: warn
          path: |
            fp16-trace.log
            /cache/ltx25/results/selective-fp16-trace-${{ github.run_id }}/results/*.json
            /cache/ltx25/results/selective-fp16-trace-${{ github.run_id }}/logs/*.log
