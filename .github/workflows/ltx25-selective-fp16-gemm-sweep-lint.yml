name: LTX-2.5 selective FP16 GEMM video sweep static and mock tests
on:
  push:
    branches: [perf/ltx25-convrot-sm70]
    paths:
      - shared/kernels/ltx25_selective_fp16_gemm.py
      - models/ltx2/ltx_pipelines/distilled.py
      - benchmarks/ltx25_convrot/summarize_selective_fp16_sweep.py
      - benchmarks/ltx25_convrot/fp16_dispatch_preflight.py
      - run_ltx25_selective_fp16_sweep_i2v_241.sh
      - run_candidate_e_fusions_i2v_241.sh
      - .github/workflows/ltx25-selective-fp16-gemm-sweep-lint.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bash and Python syntax; CLI help
        run: |
          set -euo pipefail
          bash -n run_candidate_e_fusions_i2v_241.sh
          bash -n run_ltx25_selective_fp16_sweep_i2v_241.sh
          bash run_ltx25_selective_fp16_sweep_i2v_241.sh --help
          python3 -m py_compile \
            shared/kernels/ltx25_selective_fp16_gemm.py \
            models/ltx2/ltx_pipelines/distilled.py \
            benchmarks/ltx25_convrot/summarize_selective_fp16_sweep.py \
            benchmarks/ltx25_convrot/fp16_dispatch_preflight.py
          git diff --exit-code
      - name: Mock per-phase GEMM dispatch, unselected references and video gallery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, os, sys, tempfile, types
          from pathlib import Path
          os.environ.pop("WAN2GP_LTX25_FP16_GEMM", None)
          fake = types.ModuleType("torch")
          class T:
              def __init__(self, shape, dtype, device="cuda"):
                  self.shape=shape
                  self.dtype=dtype
                  self.device=types.SimpleNamespace(type=device)
                  self.layout="strided"
                  self.ndim=len(shape)
              def to(self, dtype=None):
                  return T(self.shape, dtype, self.device.type)
              def float(self):
                  return self.to(dtype="float32")
          class Param(T): pass
          fake.Tensor=T
          fake.bfloat16="bfloat16"; fake.float16="float16"
          fake.strided="strided"
          fake.nn=types.SimpleNamespace(Parameter=Param)
          class Op:
              def __init__(self, name): self.name=name
              def __call__(self, *args, **kwargs):
                  if self.name=="mm": return T((args[0].shape[0],args[1].shape[1]),args[0].dtype)
                  if self.name=="addmm": return T((args[1].shape[0],args[2].shape[1]),args[1].dtype)
                  raise RuntimeError(self.name)
          op_mm=Op("mm"); op_addmm=Op("addmm")
          fake.ops=types.SimpleNamespace(aten=types.SimpleNamespace(
              mm=types.SimpleNamespace(default=op_mm),
              addmm=types.SimpleNamespace(default=op_addmm)))
          mod_utils=types.ModuleType("torch.utils")
          mod_dispatch=types.ModuleType("torch.utils._python_dispatch")
          class TorchDispatchMode:
              def __init__(self): pass
              def __enter__(self): return self
              def __exit__(self, *args): pass
          mod_dispatch.TorchDispatchMode=TorchDispatchMode
          sys.modules.update({"torch":fake, "torch.utils":mod_utils,
                              "torch.utils._python_dispatch":mod_dispatch})
          spec=importlib.util.spec_from_file_location("fp16_test","shared/kernels/ltx25_selective_fp16_gemm.py")
          exp=importlib.util.module_from_spec(spec);spec.loader.exec_module(exp)
          assert exp._shape_class(4096,16384)=="wide"
          assert exp._shape_class(16384,4096)=="tall"
          assert exp._shape_class(4096,4096)=="balanced"
          exp.GROUPS=frozenset(("stage2:wide",))
          exp.OPS=frozenset(("mm", "addmm"))
          exp.GUARD="off"; exp.ENABLED=True
          a=T((256,4096),"bfloat16")
          b=T((4096,16384),"bfloat16")
          m=exp._SelectiveMode("stage2")
          result=m.__torch_dispatch__(op_mm,(),(a,b))
          assert result.dtype=="bfloat16"
          assert result.shape==(256,16384)
          assert exp._COUNTS["converted_mm"]==1
          assert exp._SelectiveMode("stage1").__torch_dispatch__(op_mm,(),(a,b)).dtype=="bfloat16"
          assert exp._COUNTS["converted_mm"]==1
          bad=T((256,4096),"float16")
          assert m.__torch_dispatch__(op_mm,(),(bad,b)).dtype=="float16"
          assert exp._COUNTS["converted_mm"]==1
          bias=T((16384,),"bfloat16")
          # Mock mm/addmm selection with addmm alpha=1, beta=0 avoids float arithmetic.
          assert m.__torch_dispatch__(op_addmm,(),(bias,a,b),{"beta":0}).dtype=="bfloat16"
          assert exp._COUNTS["converted_addmm"]==1
          assert exp._COUNTS["eligible"]==2
          with tempfile.TemporaryDirectory() as temp:
              root=Path(temp)
              spec=importlib.util.spec_from_file_location("sweep_test","benchmarks/ltx25_convrot/summarize_selective_fp16_sweep.py")
              summarizer=importlib.util.module_from_spec(spec);spec.loader.exec_module(summarizer)
              (root/"settings").mkdir()
              (root/"results").mkdir()
              (root/"settings"/"input.json").write_text(json.dumps({"video_length":49,"resolution":"1024x576","num_inference_steps":8}))
              for case,elapsed,calls in (("bf16-reference",100,0),("fp16-s2-wide",97,100)):
                  (root/f"{case}.mp4").write_bytes(b"mockvideo")
                  (root/"results"/f"{case}-1.json").write_text(json.dumps({
                     "variant":case,"index":1,"seconds":elapsed,
                     "selective_fp16_gemm_calls":calls}))
              summarizer._decoded_video_hash=lambda *a:"video-hash"
              summarizer._decoded_audio_hash=lambda *a:"audio-hash"
              summarizer._video_preview=lambda *a:None
              msg=summarizer.render(root,["bf16-reference","fp16-s2-wide"])
              assert (root/"review-index.html").is_file()
              assert "fp16-s2-wide" in msg
              assert (root/"results"/"sweep-benchmark.csv").is_file()
              assert "fp16-s2-wide.mp4" in (root/"review-index.html").read_text()
              print("PASS dispatch selectors, BF16 reference, result report and review gallery")
          PY
