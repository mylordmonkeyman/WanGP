name: LTX-2.5 selective FP16 T2V harness static validation
on:
  push:
    branches: [perf/ltx25-convrot-sm70]
    paths:
      - benchmarks/ltx25_convrot/selective_fp16_t2v_smoke.py
      - shared/kernels/ltx25_selective_fp16_gemm.py
      - .github/workflows/ltx25-selective-fp16-t2v-static.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and mock ABBA / numerical summary on CPU
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            benchmarks/ltx25_convrot/selective_fp16_t2v_smoke.py \
            shared/kernels/ltx25_selective_fp16_gemm.py
          python3 - <<'PY'
          import importlib.util, tempfile, pathlib, json
          spec=importlib.util.spec_from_file_location("smoke", "benchmarks/ltx25_convrot/selective_fp16_t2v_smoke.py")
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          with tempfile.TemporaryDirectory() as d:
              root=pathlib.Path(d)
              m.OUT=root
              m.ffmpeg_bin=lambda: "mock"
              m.psnr=lambda *a:{"status":"PASS","average_db":28.75}
              rows=[]
              for case,kind,groups,audit,desc in m.CASES:
                  (root/f"{case}.mp4").write_bytes(b"mock mp4")
                  rows.append({"variant":case,"kind":kind,"groups":groups,
                               "audit_per_shape":audit,"wall_seconds":100 if case.startswith("sham")
                               else 90 if case.startswith("fp16-b")
                               else 110,
                               "status":"PASS","video_sha256":case,"audio_sha256":"pcm",
                               "clip":str(root/f"{case}.mp4")})
              report=m.report_summary(rows)
              assert report["status"]=="PASS"
              assert report["matched_sham_vs_fp16_abba"]["time_reduction_percent"]==10
              assert (root/"smoke-summary.json").is_file()
              assert (root/"smoke-results.csv").is_file()
              assert len(m.CASES)>=8
              print("T2V_ABBA_STATIC_REPORT_OK",len(rows))
          PY
