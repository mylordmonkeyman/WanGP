name: LTX-2.5 stage pinned support weights

# Manual execution only. Editing this file does not start downloads or GPU jobs.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ltx25-stage-support
  cancel-in-progress: false

jobs:
  stage:
    name: Verify and stage LTX-2.5 inference support
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 120
    steps:
      - name: Checkout pinned branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download and SHA256 verify frozen supporting weights
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/prepare_support.py

      - name: Publish sanitized download receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/ltx25_convrot/publish_support_status.py
