name: LTX-2.5 V100 Stage2 cold allocator cache 73f T2V I2V ABBA
on:
  push:
    branches: [perf/ltx25-v100-mmgp-transfer-20261115]
    paths:
      - .github/workflows/ltx25-stage2-cold-cache-abba-v100.yml
      - benchmarks/ltx25_convrot/benchmark_stage2_cold_cache_73f_abba.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-v100-stage2-cold-cache-abba
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Verify reversible default-OFF flag and untouched model arithmetic
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile models/ltx2/ltx_pipelines/distilled.py benchmarks/ltx25_convrot/benchmark_stage2_cold_cache_73f_abba.py
          git diff --exit-code 8788b0479362c34e6423d331f115767ad9fe6fdc HEAD -- mmgp/ shared/qtypes/ wgp.py benchmarks/ltx25_convrot/ltx25_cublas_e.cu
          python3 - <<'PY'
          from pathlib import Path
          p=Path('models/ltx2/ltx_pipelines/distilled.py').read_text()
          s=Path('benchmarks/ltx25_convrot/benchmark_stage2_cold_cache_73f_abba.py').read_text()
          assert p.count('WAN2GP_LTX25_STAGE2_KEEP_CUDA_CACHE')==1
          assert 'WAN2GP_LTX25_STAGE2_KEEP_CUDA_CACHE", "0"' in p
          assert p.count('            cleanup_memory()')==1
          assert p.count('            gc.collect()')==1
          assert 'WAN2GP_LTX25_E_EPILOGUE_TILED"]="0"' in s
          assert 'WAN2GP_LTX25_STAGE2_KEEP_CUDA_CACHE"]="1" if keep_cache else "0"' in s
          assert 'four.settings(73)' in s
          assert 'STAGE2_COLD_CACHE_73F_ABBA_PASS' in s
          print("LTX25_COLD_CACHE_STATIC_PASS")
          PY
  benchmark:
    needs: syntax
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 80
    env:
      PYTHONPATH: .
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_COLD_CACHE_ABBA_ROOT: /cache/ltx25/results/stage2-cold-cache-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Confirm free V100 and original conditioning image/checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test -x "$LTX25_PYTHON"
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          test -s benchmarks/ltx25_convrot/inputs/profile_i2v_1024x576.png.png
          "$LTX25_PYTHON" -c 'import torch; assert torch.cuda.get_device_capability(0)==(7,0)'
          test -z "$(nvidia-smi --query-compute-apps=pid --format=csv,noheader | grep -E '[0-9]' || true)"
      - name: Run 8 generation whole-process matched A-B-B-A across T2V and I2V
        shell: bash
        run: |
          set -euo pipefail
          "$LTX25_PYTHON" -u benchmarks/ltx25_convrot/benchmark_stage2_cold_cache_73f_abba.py 2>&1 | tee stage2-cold-cache-abba.log
          grep -Fq STAGE2_COLD_CACHE_73F_ABBA_PASS stage2-cold-cache-abba.log
      - name: Upload raw generation logs, quality hashes, and paired timings
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ltx25-stage2-cold-cache-73f-abba
          retention-days: 21
          if-no-files-found: warn
          path: |
            stage2-cold-cache-abba.log
            /cache/ltx25/results/stage2-cold-cache-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/manifest.json
            /cache/ltx25/results/stage2-cold-cache-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/partial.json
            /cache/ltx25/results/stage2-cold-cache-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/summary.json
            /cache/ltx25/results/stage2-cold-cache-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/results/*.json
            /cache/ltx25/results/stage2-cold-cache-abba-${{ github.run_id }}-attempt${{ github.run_attempt }}/logs/*.log
