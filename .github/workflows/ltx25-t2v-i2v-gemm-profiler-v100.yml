name: LTX-2.5 V100 matched T2V I2V GEMM and CUDA kernel profiler
on:
  push:
    branches: [perf/ltx25-convrot-sm70]
    paths:
      - benchmarks/ltx25_convrot/profile_t2v_i2v_gemm.signal
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltx25-runtime-baseline-once
  cancel-in-progress: false
jobs:
  profile:
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 80
    env:
      PYTHONPATH: .
      LTX25_PYTHON: /opt/venvs/ltx25-cu128/bin/python
      LTX25_GEMM_PROFILE_ROOT: /cache/ltx25/results/controlled-t2v-i2v-gemms-${{ github.run_id }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout isolated experimental feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Validate Python scripts, checkpoint, bar input and idle V100
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python -m py_compile \
            shared/kernels/ltx25_pipeline_profile.py \
            shared/kernels/ltx25_selective_fp16_gemm.py \
            benchmarks/ltx25_convrot/selective_fp16_t2v_smoke.py \
            benchmarks/ltx25_convrot/profile_gemm_t2v_i2v.py
          test -s benchmarks/ltx25_convrot/inputs/profile_i2v_1024x576.png.png
          test -s /opt/ltx25/checkpoints/ltx-2.5-22b-distilled_diffusion_model_int8_convrot.safetensors
          /opt/venvs/ltx25-cu128/bin/python - <<'PY'
          from pathlib import Path
          from struct import unpack
          p=Path("benchmarks/ltx25_convrot/inputs/profile_i2v_1024x576.png.png")
          b=p.read_bytes()[:24]
          assert b[:8]==bytes.fromhex("89504e470d0a1a0a")
          assert unpack(">II",b[16:24])==(1024,576),unpack(">II",b[16:24])
          print("MATCHED_I2V_INPUT_VALIDATED",p)
          PY
          busy="$(nvidia-smi --query-compute-apps=pid,used_gpu_memory --format=csv,noheader | grep -E '^[[:space:]]*[0-9]+[[:space:]]*,' || true)"
          if [[ -n "$busy" ]]; then echo "::error::GPU occupied $busy"; exit 1; fi
          /opt/venvs/ltx25-cu128/bin/python benchmarks/ltx25_convrot/fp16_quanto_direct_preflight.py \
            2>&1 | tee profiler-preflight.log
          grep -Fq 'LTX25_QUANTO_DIRECT_PREFLIGHT_PASS ' profiler-preflight.log
      - name: Generate matched bar T2V and I2V and profile stage CUDA GEMMs
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python -u \
            benchmarks/ltx25_convrot/profile_gemm_t2v_i2v.py \
            2>&1 | tee matched-t2v-i2v-gemm-profiler.log
          grep -Fq 'LTX25_T2V_I2V_GEMM_PROFILE_PASS ' matched-t2v-i2v-gemm-profiler.log
      - name: Upload GPU kernel census, Quanto shapes, times, videos and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ltx25-controlled-t2v-i2v-cuda-gemm-profiler
          retention-days: 21
          if-no-files-found: warn
          path: |
            profiler-preflight.log
            matched-t2v-i2v-gemm-profiler.log
            /cache/ltx25/results/controlled-t2v-i2v-gemms-${{ github.run_id }}/comparison.txt
            /cache/ltx25/results/controlled-t2v-i2v-gemms-${{ github.run_id }}/comparison.json
            /cache/ltx25/results/controlled-t2v-i2v-gemms-${{ github.run_id }}/input.json
            /cache/ltx25/results/controlled-t2v-i2v-gemms-${{ github.run_id }}/t2v-input.json
            /cache/ltx25/results/controlled-t2v-i2v-gemms-${{ github.run_id }}/i2v-input.json
            /cache/ltx25/results/controlled-t2v-i2v-gemms-${{ github.run_id }}/*.mp4
            /cache/ltx25/results/controlled-t2v-i2v-gemms-${{ github.run_id }}/results/*.json
            /cache/ltx25/results/controlled-t2v-i2v-gemms-${{ github.run_id }}/logs/*.log
