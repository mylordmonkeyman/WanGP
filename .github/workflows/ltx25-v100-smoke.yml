name: LTX-2.5 V100 Phase 0 smoke

# Manual execution only. Editing or pushing code must never start GPU jobs.
# Run only after the intended batch of changes is committed.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ltx25-v100-smoke
  cancel-in-progress: false

jobs:
  v100-smoke:
    name: CUDA 12.8 + cuBLAS + PyTorch SM70
    runs-on: [self-hosted, linux, x64, v100, sm70, ltx25]
    timeout-minutes: 60
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Report runner and CUDA environment
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uname -a
          nvidia-smi -L
          nvidia-smi
          nvcc --version
          test "$(nvidia-smi --query-gpu=uuid --format=csv,noheader | wc -l)" -eq 1

      - name: Compile and execute SM70 cuBLAS FP32-output smoke
        shell: bash
        run: |
          set -euo pipefail
          nvcc -O3 -std=c++17 -arch=sm_70             benchmarks/ltx25_convrot/smoke_cublas_sm70.cu             -lcublas -o "$RUNNER_TEMP/ltx25_sm70_cublas_smoke"
          "$RUNNER_TEMP/ltx25_sm70_cublas_smoke"

      - name: Validate pre-baked Python/CUDA environment (no pip)
        shell: bash
        run: |
          set -euo pipefail
          test -x /opt/venvs/ltx25-cu128/bin/python || {
            echo "Run benchmarks/ltx25_convrot/docker/bake_runner_image.sh on host first" >&2
            exit 1
          }
          /opt/venvs/ltx25-cu128/bin/python -c 'import torch,torchaudio,torchvision,sysconfig,pathlib; assert torch.__version__.startswith("2.10.0+cu128"); assert torch.cuda.get_device_capability()==(7,0); assert (pathlib.Path(sysconfig.get_path("include"))/"Python.h").is_file()'

      - name: Run real SM70 PyTorch operations
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python             benchmarks/ltx25_convrot/smoke_torch_sm70.py

      - name: Phase 0 exploratory environment, checkpoint visibility and rotation
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/phase0_probe.py

      - name: Inspect pinned upstream ConvRot checkpoint header without downloading weights
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python benchmarks/ltx25_convrot/remote_header.py

      - name: Test actual INT8 checkpoint layers against FP32 mathematical reference
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/phase0_weights.py

      - name: Compile exploratory bounded FP32-output cuBLAS Candidate E
        shell: bash
        run: |
          set -euo pipefail
          nvcc -O3 -std=c++17 -arch=sm_70 -shared -Xcompiler -fPIC \
            benchmarks/ltx25_convrot/ltx25_cublas_e.cu \
            -lcublas -o "$RUNNER_TEMP/libltx25_cublas_e.so"

      - name: Benchmark cuBLAS Candidate E against checkpoint-backed R0 and R1
        env:
          LTX25_CUBLAS_E_LIB: ${{ runner.temp }}/libltx25_cublas_e.so
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/phase1_cublas_e.py

      - name: Inventory supporting LTX-2.5/Gemma4 checkpoint sizes (no downloads)
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/support_manifest.py

      - name: Probe full WanGP LTX-2.5 model import prerequisites (no inference)
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/runtime_import_probe.py

      - name: Verify actual QLinear ConvRot forward dispatcher on real checkpoint weights
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/phase0_dispatch_probe.py

      - name: Audit FP32-rotation precision on multiple checkpoint layers and seeds
        env:
          LTX25_CUBLAS_E_LIB: ${{ runner.temp }}/libltx25_cublas_e.so
        shell: bash
        run: |
          set -euo pipefail
          /opt/venvs/ltx25-cu128/bin/python \
            benchmarks/ltx25_convrot/precision_audit.py

      - name: Publish sanitized report to isolated results branch
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/ltx25_convrot/publish_phase0_status.py
